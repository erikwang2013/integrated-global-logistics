services:
  # ============================================================
  # Web 应用 + Nginx 反向代理
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: open-admin-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./public:/app/public:ro
      - ./docs/nginx-security.conf:/etc/nginx/conf.d/security.conf:ro
    depends_on:
      - app
    networks:
      - open-admin

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-admin-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - app-runtime:/app/runtime
    command: ["php", "start.php", "start"]
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - open-admin

  # ============================================================
  # 数据服务
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: open-admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-logistics}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/install.sql:/docker-entrypoint-initdb.d/install.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - open-admin

  redis:
    image: redis:7-alpine
    container_name: open-admin-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - open-admin

volumes:
  mysql-data:
  redis-data:
  app-runtime:

networks:
  open-admin:
    driver: bridge
