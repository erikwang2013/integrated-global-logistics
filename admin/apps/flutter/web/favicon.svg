<svg xmlns="http://www.w3.org/2000/svg" viewBox="126 50 260 260" role="img"
     aria-label="E-Cat 项目宠物（动态版）">
  <title>E-Cat 项目宠物</title>
  <desc>物流聚合平台项目宠物 E-Cat：戴追踪雷达帽、手捧包裹的猫，带呼吸 / 眨眼 / 摇尾 / 雷达扫描动画。</desc>

  <style>
    .ecat-pet, .ecat-head, .ecat-tail, .ecat-eyes, .ecat-ear-l, .ecat-ear-r,
    .radar-sweep, .radar-ring, .ant-wave, .antenna-dot { transform-box: view-box; }

    /* 呼吸：从脚底向上轻微起伏 */
    .ecat-pet  { transform-origin: 256px 466px; animation: ecat-breath 3.6s ease-in-out infinite; }
    @keyframes ecat-breath {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(1.012, 1.022); }
    }

    /* 头部浮动 */
    .ecat-head { transform-origin: 256px 282px; animation: ecat-bob 3.6s ease-in-out infinite; }
    @keyframes ecat-bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-3px) rotate(-1.2deg); }
    }

    /* 尾巴摇摆 */
    .ecat-tail { transform-origin: 140px 428px; animation: ecat-wag 1.6s ease-in-out infinite; }
    @keyframes ecat-wag {
      0%, 100% { transform: rotate(-8deg); }
      50%      { transform: rotate(10deg); }
    }

    /* 眨眼 */
    .ecat-eyes { transform-origin: 256px 196px; animation: ecat-blink 5.2s ease-in-out infinite; }
    @keyframes ecat-blink {
      0%, 90%, 100% { transform: scaleY(1); }
      93%, 96%      { transform: scaleY(0.08); }
    }

    /* 耳朵轻抖 */
    .ecat-ear-l { transform-origin: 211px 139px; animation: ecat-ear-l 4.2s ease-in-out infinite; }
    @keyframes ecat-ear-l {
      0%, 72%, 100% { transform: rotate(0deg); }
      80%           { transform: rotate(-4deg); }
      90%           { transform: rotate(0deg); }
    }
    .ecat-ear-r { transform-origin: 301px 139px; animation: ecat-ear-r 4.2s ease-in-out infinite; }
    @keyframes ecat-ear-r {
      0%, 72%, 100% { transform: rotate(0deg); }
      80%           { transform: rotate(4deg); }
      90%           { transform: rotate(0deg); }
    }

    /* 雷达扫描 */
    .radar-sweep { transform-origin: 256px 256px; animation: radar-spin 7s linear infinite; }
    @keyframes radar-spin { to { transform: rotate(360deg); } }

    /* 雷达圈脉冲 */
    .radar-ring { animation: radar-pulse 3.2s ease-in-out infinite; }
    @keyframes radar-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

    /* 天线信号波 */
    .ant-wave { animation: ant-signal 2.2s ease-out infinite; }
    .ant-wave.w2 { animation-delay: .5s; }
    @keyframes ant-signal {
      0%   { opacity: .2; }
      40%  { opacity: 1; }
      100% { opacity: .25; }
    }
    .antenna-dot { animation: antenna-glow 2.2s ease-in-out infinite; }
    @keyframes antenna-glow { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

    @media (prefers-reduced-motion: reduce) {
      .ecat-pet, .ecat-head, .ecat-tail, .ecat-eyes, .ecat-ear-l, .ecat-ear-r,
      .radar-sweep, .radar-ring, .ant-wave, .antenna-dot { animation: none; }
    }
  </style>

  <!-- 雷达信号背景 -->
  <circle cx="256" cy="256" r="244" fill="#F0F6FF"/>
  <circle class="radar-ring" cx="256" cy="256" r="196" fill="none" stroke="#DCE8FB" stroke-width="3" stroke-dasharray="12 10"/>
  <circle class="radar-ring" cx="256" cy="256" r="150" fill="none" stroke="#E7F0FD" stroke-width="2.5"/>
  <path class="radar-sweep" d="M256,256 L256,86 A170,170 0 0 1 403,206 Z" fill="#2B5CD9" fill-opacity="0.06"/>

  <g class="ecat-pet">
    <!-- 尾巴 -->
    <g class="ecat-tail">
      <path d="M142,428 C96,436 78,404 82,372 C85,348 104,338 118,340"
            stroke="#FF8A3D" stroke-width="20" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 脚 -->
    <ellipse cx="206" cy="466" rx="34" ry="15" fill="#FF8A3D"/>
    <ellipse cx="306" cy="466" rx="34" ry="15" fill="#FF8A3D"/>

    <!-- 身体 -->
    <path d="M138,296 C140,258 196,240 256,240 C316,240 372,258 374,296
             L372,420 C371,452 322,462 256,462 C190,462 141,452 140,420 Z"
          fill="#2B5CD9"/>
    <!-- 肚皮 -->
    <ellipse cx="256" cy="398" rx="88" ry="52" fill="#3F6BE0"/>

    <!-- 手臂（捧包裹） -->
    <path d="M150,322 C134,356 156,386 186,396" stroke="#2B5CD9" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M362,322 C378,356 356,386 326,396" stroke="#2B5CD9" stroke-width="26" stroke-linecap="round" fill="none"/>

    <!-- 包裹 -->
    <rect x="192" y="336" width="128" height="92" rx="10" fill="#D9A05B"/>
    <rect x="244" y="336" width="24" height="92" fill="#F7E3C1"/>
    <rect x="192" y="368" width="128" height="20" fill="#F7E3C1"/>
    <!-- 条形码 -->
    <rect x="206" y="352" width="8" height="26" fill="#8A5A2B"/>
    <rect x="218" y="352" width="4" height="26" fill="#8A5A2B"/>
    <rect x="226" y="352" width="8" height="26" fill="#8A5A2B"/>

    <g class="ecat-head">
      <!-- 耳朵 -->
      <g class="ecat-ear-l">
        <path d="M176,150 L208,74 L246,128 Z" fill="#FF8A3D"/>
        <path d="M188,142 L212,90 L234,128 Z" fill="#FFD9B8"/>
      </g>
      <g class="ecat-ear-r">
        <path d="M336,150 L304,74 L266,128 Z" fill="#FF8A3D"/>
        <path d="M324,142 L300,90 L278,128 Z" fill="#FFD9B8"/>
      </g>

      <!-- 头 -->
      <circle cx="256" cy="192" r="90" fill="#FF8A3D"/>

      <!-- 追踪雷达帽 -->
      <path d="M172,180 Q172,128 256,124 Q340,128 340,180 Z" fill="#2B5CD9"/>
      <rect x="156" y="172" width="200" height="22" rx="11" fill="#2349B0"/>
      <circle cx="256" cy="148" r="15" fill="#FFFFFF"/>
      <text x="256" y="148" text-anchor="middle" dominant-baseline="central"
            font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2B5CD9">E</text>
      <!-- 天线与信号波 -->
      <line x1="256" y1="124" x2="256" y2="88" stroke="#26324B" stroke-width="4"/>
      <circle class="antenna-dot" cx="256" cy="82" r="8" fill="#FF8A3D"/>
      <path class="ant-wave w1" d="M274,70 A30,30 0 0 1 274,94" stroke="#FF8A3D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path class="ant-wave w2" d="M284,62 A44,44 0 0 1 284,102" stroke="#FF8A3D" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- 眼睛 -->
      <g class="ecat-eyes">
        <circle cx="220" cy="196" r="11" fill="#26324B"/>
        <circle cx="292" cy="196" r="11" fill="#26324B"/>
        <circle cx="224" cy="192" r="4" fill="#FFFFFF"/>
        <circle cx="296" cy="192" r="4" fill="#FFFFFF"/>
      </g>
      <!-- 腮红 -->
      <ellipse cx="198" cy="214" rx="12" ry="7" fill="#FFB4A8" fill-opacity="0.8"/>
      <ellipse cx="314" cy="214" rx="12" ry="7" fill="#FFB4A8" fill-opacity="0.8"/>
      <!-- 嘴 -->
      <path d="M236,224 Q256,240 276,224" stroke="#26324B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <!-- 胡须 -->
      <path d="M172,206 L134,198" stroke="#26324B" stroke-width="3" stroke-linecap="round"/>
      <path d="M172,218 L136,224" stroke="#26324B" stroke-width="3" stroke-linecap="round"/>
      <path d="M340,206 L378,198" stroke="#26324B" stroke-width="3" stroke-linecap="round"/>
      <path d="M340,218 L376,224" stroke="#26324B" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 水印 -->
  <text x="380" y="304" text-anchor="end" font-family="Arial, sans-serif" font-size="11"
        fill="#1B2A4A" fill-opacity="0.35">erik.xyz</text>
</svg>
