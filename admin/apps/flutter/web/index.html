  <style>
    /* 首屏加载层：Flutter 引擎启动期间展示项目宠物 E-Cat */
    #ecat-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #f0f2f5;
      /* 永不吃掉点击事件，即使淡出失败也不会挡住应用 */
      pointer-events: none;
      transition: opacity .45s ease;
    }
    #ecat-loader.ecat-loader-hide { opacity: 0; }
    #ecat-loader .ecat-loader-pet { width: 168px; height: 168px; }
    #ecat-loader .ecat-loader-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #5a6b8c;
      letter-spacing: .5px;
    }
    #ecat-loader .ecat-loader-bar {
      width: 168px;
      height: 4px;
      border-radius: 2px;
      background: #dbe4f5;
      overflow: hidden;
    }
    #ecat-loader .ecat-loader-bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #2B5CD9;
      animation: ecat-loader-slide 1.25s ease-in-out infinite;
    }
    @keyframes ecat-loader-slide {
      0%   { transform: translateX(-105%); }
      100% { transform: translateX(255%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #ecat-loader .ecat-loader-bar span { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <!-- 首屏加载层：E-Cat 项目宠物（Flutter 首帧渲染后自动淡出） -->
  <div id="ecat-loader">

        .ecat-head { transform-origin: 256px 282px; animation: ecat-bob 3.6s ease-in-out infinite; }
        @keyframes ecat-bob { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-3px) rotate(-1.2deg)} }
        .ecat-tail { transform-origin: 140px 428px; animation: ecat-wag 1.6s ease-in-out infinite; }
        @keyframes ecat-wag { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(10deg)} }
        .ecat-eyes { transform-origin: 256px 196px; animation: ecat-blink 5.2s ease-in-out infinite; }
        @keyframes ecat-blink { 0%,90%,100%{transform:scaleY(1)} 93%,96%{transform:scaleY(.08)} }
        .ecat-ear-l { transform-origin: 211px 139px; animation: ecat-ear-l 4.2s ease-in-out infinite; }
        @keyframes ecat-ear-l { 0%,72%,100%{transform:rotate(0deg)} 80%{transform:rotate(-4deg)} 90%{transform:rotate(0deg)} }
        .ecat-ear-r { transform-origin: 301px 139px; animation: ecat-ear-r 4.2s ease-in-out infinite; }
        @keyframes ecat-ear-r { 0%,72%,100%{transform:rotate(0deg)} 80%{transform:rotate(4deg)} 90%{transform:rotate(0deg)} }
        .radar-sweep { transform-origin: 256px 256px; animation: radar-spin 7s linear infinite; }
        @keyframes radar-spin { to { transform: rotate(360deg); } }
        .radar-ring { animation: radar-pulse 3.2s ease-in-out infinite; }
        @keyframes radar-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
        .ant-wave { animation: ant-signal 2.2s ease-out infinite; }
        .ant-wave.w2 { animation-delay: .5s; }
        @keyframes ant-signal { 0%{opacity:.2} 40%{opacity:1} 100%{opacity:.25} }
        .antenna-dot { animation: antenna-glow 2.2s ease-in-out infinite; }
        @keyframes antenna-glow { 0%,100%{opacity:1} 50%{opacity:.4} }
        @media (prefers-reduced-motion: reduce) {
          .ecat-pet, .ecat-head, .ecat-tail, .ecat-eyes, .ecat-ear-l, .ecat-ear-r,
          .radar-sweep, .radar-ring, .ant-wave, .antenna-dot { animation: none; }
        }

        <path d="M362,322 C378,356 356,386 326,396" stroke="#2B5CD9" stroke-width="26" stroke-linecap="round" fill="none"/>
        <rect x="192" y="336" width="128" height="92" rx="10" fill="#D9A05B"/>
        <rect x="244" y="336" width="24" height="92" fill="#F7E3C1"/>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Flutter Web 首帧渲染后移除加载层；20s 兜底，避免加载层常驻
    (function () {
      var el = document.getElementById('ecat-loader');
      if (!el) return;
      var hidden = false;
      function hide() {
        if (hidden) return;
        hidden = true;
        el.classList.add('ecat-loader-hide');
        setTimeout(function () { el.remove(); }, 600);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 20000);
    })();
  </script>
</body>
