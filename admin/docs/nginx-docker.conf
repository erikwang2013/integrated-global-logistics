#
# 挂载到 /etc/nginx/conf.d/default.conf（覆盖镜像默认站点）
# conf.d 在 http {} 内加载，因此 limit_*_zone 可写在本文件顶部
# ============================================================

# --- 限流/限连区域（http 级） ---
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # 与后端 SecurityFilter 的 10MB 上限一致
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    limit_conn perip 20;

    # --- 安全头 ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- 禁止访问敏感文件 ---
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(?:sql|log|env|yml|yaml|bak|swp|old|dist)$ {
        deny all;
        return 404;
    }

    # --- 禁止不安全的 HTTP 方法 ---
    if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # --- 反向代理到 webman（X-Forwarded-For 覆盖而非追加，防止客户端伪造 IP） ---
    location / {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://app:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
