    <rect x="780" y="536" width="200" height="36" rx="8" fill="#17A2B8"/>
    <text x="880" y="559" font-size="11.5" font-weight="bold">55+ crates ফুল-স্ট্যাক ফ্রেমওয়ার্ক</text>
