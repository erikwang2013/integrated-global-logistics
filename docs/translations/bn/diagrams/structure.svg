  <text x="910" y="254" text-anchor="middle" font-size="11" fill="#6C757D">12 ভাষার README</text>

  <!-- 底部注释 -->
  <rect x="80" y="300" width="940" height="150" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <text x="110" y="334" font-size="13" font-weight="bold" fill="#1F4E79">কম্পোনেন্টের ভূমিকা</text>
  <text x="110" y="364" font-size="11.5" fill="#212529">admin —— ম্যানেজমেন্ট পৃষ্ঠা ও PHP ওয়ার্কার পুল: ক্যারিয়ার প্রোফাইল, কী এনক্রিপশন, কুয়েরি রেকর্ড, কলব্যাক সাবস্ক্রিপশন, RBAC পারমিশন</text>
  <text x="110" y="392" font-size="11.5" fill="#212529">infrastructure —— উচ্চ-পারফরম্যান্স পৃষ্ঠা: e-cat গেটওয়ে 209টি PHP অ্যাডাপ্টার পুনঃব্যবহার করে, Redis ক্যাশ/রেট লিমিট/সার্কিট ব্রেকার/লোড ব্যালেন্সিং</text>
  <text x="110" y="420" font-size="11.5" fill="#212529">docs —— পরিকল্পনা ডকুমেন্ট ও ভিজ্যুয়ালাইজেশন: আর্কিটেকচার, ডেটা ফ্লো, সিকিউরিটি ডিজাইন, 12 ভাষার অনুবাদ তুলনার জন্য</text>

  <!-- 底部数据条 -->
  <rect x="80" y="480" width="940" height="110" rx="8" fill="#1F4E79"/>
  <text x="550" y="516" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">ইকোসিস্টেম ও গুণমান</text>
  <g font-size="13" fill="#FFFFFF" text-anchor="middle">
    <rect x="120" y="536" width="200" height="36" rx="8" fill="#2E86DE"/>
    <text x="220" y="559" font-size="12.5" font-weight="bold">209 ক্যারিয়ার</text>
    <rect x="340" y="536" width="200" height="36" rx="8" fill="#17A2B8"/>
    <text x="440" y="559" font-size="11.5" font-weight="bold">187টি ট্র্যাকিং নম্বর নিয়ম</text>
    <rect x="560" y="536" width="200" height="36" rx="8" fill="#2E86DE"/>
