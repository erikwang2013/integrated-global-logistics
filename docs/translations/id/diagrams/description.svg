<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="44" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F4E79">Penjelasan Proyek: Enam Kemampuan Inti</text>
  <text x="600" y="72" text-anchor="middle" font-size="12" fill="#212529">Facade terpadu · Identifikasi otomatis · Status terpadu · Gateway berkinerja tinggi · Tata kelola elastis · Kepatuhan keamanan</text>

  <!-- 卡片行一 -->
  <g>
    <rect x="40" y="104" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="40" y="104" width="360" height="10" rx="5" fill="#1F4E79"/>
    <text x="220" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">Facade terpadu</text>
    <text x="220" y="186" text-anchor="middle" font-size="12.5" fill="#212529">Logistics::track satu pintu masuk</text>
    <text x="220" y="214" text-anchor="middle" font-size="11.5" fill="#212529">Identifikasi otomatis jalur dan operator</text>
    <text x="220" y="242" text-anchor="middle" font-size="11.5" fill="#212529">Pihak bisnis tak perlu peduli perbedaan protokol</text>
    <text x="220" y="278" text-anchor="middle" font-size="11.5" fill="#6C757D">Signature / OAuth2 / XML / JSON / Pemetaan status</text>
    <text x="220" y="308" text-anchor="middle" font-size="11" fill="#17A2B8">Satu model data, satu bentuk integrasi</text>

    <rect x="420" y="104" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="420" y="104" width="360" height="10" rx="5" fill="#2E86DE"/>
    <text x="600" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">Identifikasi otomatis</text>
    <text x="600" y="186" text-anchor="middle" font-size="11.5" fill="#212529">187 aturan regex menentukan jalur dan operator</text>
    <text x="600" y="214" text-anchor="middle" font-size="11.5" fill="#212529">Sensitif urutan, prioritaskan hit aturan domestik</text>
    <text x="600" y="242" text-anchor="middle" font-size="11.5" fill="#212529">Mis. 申通 berawalan 77 lebih dulu dari aturan 13 digit</text>
    <text x="600" y="278" text-anchor="middle" font-size="11.5" fill="#6C757D">Panggil jalur eksplisit domestic / international</text>
    <text x="600" y="308" text-anchor="middle" font-size="11" fill="#17A2B8">Jika tak teridentifikasi, kembalikan sesuai prioritas</text>

    <rect x="800" y="104" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="800" y="104" width="360" height="10" rx="5" fill="#17A2B8"/>
    <text x="980" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">Status terpadu</text>
    <text x="980" y="186" text-anchor="middle" font-size="12.5" fill="#212529">7 semantik TrackStatus</text>
    <text x="980" y="214" text-anchor="middle" font-size="11" fill="#212529">Menunggu jemput → Dalam kirim → Sedang diantar → Diterima</text>
    <text x="980" y="242" text-anchor="middle" font-size="12.5" fill="#212529">Anomali jadi EXCEPTION · Retur jadi RETURNED</text>
    <text x="980" y="278" text-anchor="middle" font-size="11.5" fill="#6C757D">Tak dikenali jadi UNKNOWN</text>
    <text x="980" y="308" text-anchor="middle" font-size="11" fill="#17A2B8">Status mentah semua operator dipetakan terpadu, bisnis hanya berhadapan satu</text>
  </g>

  <!-- 卡片行二 -->
  <g>
    <rect x="40" y="354" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="40" y="354" width="360" height="10" rx="5" fill="#1F4E79"/>
    <text x="220" y="402" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">Gateway berkinerja tinggi</text>
    <text x="220" y="436" text-anchor="middle" font-size="11.5" fill="#212529">Proses menetap Rust e-cat latensi rendah</text>
    <text x="220" y="464" text-anchor="middle" font-size="11.5" fill="#212529">Hit cache langsung balik, tanpa masuk PHP</text>
    <text x="220" y="492" text-anchor="middle" font-size="11.5" fill="#212529">Worker stateless, bisa skala horizontal</text>
    <text x="220" y="528" text-anchor="middle" font-size="11" fill="#6C757D">Permukaan kontrak internal kecil: queryTrack + registry</text>
    <text x="220" y="558" text-anchor="middle" font-size="11" fill="#17A2B8">Kopling lintas bahasa terkendali, kredensial tak diturunkan ke gateway</text>

    <rect x="420" y="354" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="420" y="354" width="360" height="10" rx="5" fill="#2E86DE"/>
    <text x="600" y="402" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">Tata kelola elastis</text>
    <text x="600" y="436" text-anchor="middle" font-size="12.5" fill="#212529">Cache Redis (TTL 5~60 mnt)</text>
    <text x="600" y="464" text-anchor="middle" font-size="12.5" fill="#212529">Rate limit per API-Key/IP (429)</text>
    <text x="600" y="492" text-anchor="middle" font-size="11.5" fill="#212529">Circuit breaker per operator (fast-fail 503)</text>
    <text x="600" y="520" text-anchor="middle" font-size="12.5" fill="#212529">Load balancing RoundRobin</text>
    <text x="600" y="558" text-anchor="middle" font-size="11" fill="#17A2B8">RetryingClient dalam paket menyertakan 2 percobaan ulang</text>

    <rect x="800" y="354" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="800" y="354" width="360" height="10" rx="5" fill="#17A2B8"/>
    <text x="980" y="402" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">Kepatuhan keamanan</text>
    <text x="980" y="436" text-anchor="middle" font-size="11.5" fill="#212529">Kredensial dienkripsi Encryptable saat disimpan</text>
    <text x="980" y="464" text-anchor="middle" font-size="11.5" fill="#212529">Verifikasi signature HMAC callback</text>
    <text x="980" y="492" text-anchor="middle" font-size="11.5" fill="#212529">Pencatatan audit operasi di seluruh rantai</text>
    <text x="980" y="528" text-anchor="middle" font-size="11" fill="#6C757D">18 lapis pertahanan · Nol kunci hardcoded</text>
    <text x="980" y="558" text-anchor="middle" font-size="11" fill="#17A2B8">API internal hanya jaringan internal + header kunci bersama</text>
  </g>
<text x="1188" y="630" fill="rgba(33,37,41,0.35)" font-size="12" font-family="Arial, sans-serif" text-anchor="end">erik.xyz</text>
</svg>
