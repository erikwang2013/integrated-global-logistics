  <text x="910" y="254" text-anchor="middle" font-size="11" fill="#6C757D">README 12 bahasa</text>

  <!-- 底部注释 -->
  <rect x="80" y="300" width="940" height="150" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <text x="110" y="334" font-size="13" font-weight="bold" fill="#1F4E79">Peran komponen</text>
  <text x="110" y="364" font-size="11.5" fill="#212529">admin —— sisi manajemen dan kumpulan worker PHP: profil operator, enkripsi kunci, catatan query, langganan callback, izin RBAC</text>
  <text x="110" y="392" font-size="11.5" fill="#212529">infrastructure —— sisi berkinerja tinggi: gateway e-cat menggunakan kembali 209 adapter PHP, cache/rate limit/circuit breaker/load balancing Redis</text>
  <text x="110" y="420" font-size="11.5" fill="#212529">docs —— dokumen perencanaan dan visualisasi: arsitektur, alur data, desain keamanan, untuk pembanding terjemahan 12 bahasa</text>

  <!-- 底部数据条 -->
  <rect x="80" y="480" width="940" height="110" rx="8" fill="#1F4E79"/>
  <text x="550" y="516" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Ekosistem dan kualitas</text>
  <g font-size="13" fill="#FFFFFF" text-anchor="middle">
    <rect x="120" y="536" width="200" height="36" rx="8" fill="#2E86DE"/>
