<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F4E79">Pertahanan Keamanan: Pertahanan Berlapis Mendalam</text>

  <!-- 第一层：网关层 -->
  <rect x="40" y="70" width="1120" height="240" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="70" width="220" height="240" rx="8" fill="#1F4E79"/>
  <text x="150" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Lapisan gateway</text>
  <text x="150" y="134" text-anchor="middle" font-size="12.5" fill="#D7E5F3">tracking-gateway（Rust）</text>
  <text x="150" y="154" text-anchor="middle" font-size="11" fill="#D7E5F3">Garis pertahanan pertama</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="118" text-anchor="middle" font-weight="bold" font-size="11.5">>Autentikasi API-Key</text>
    <text x="390" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Header X-API-Key, key disimpan terenkripsi</text>
    <rect x="510" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="118" text-anchor="middle" font-weight="bold" font-size="11.5">>Rate limit Redis</text>
    <text x="610" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Sliding window per API-Key / IP</text>
    <rect x="730" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="118" text-anchor="middle" font-weight="bold" font-size="11.5">>Circuit breaker</text>
    <text x="830" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Fast-fail dengan probe setengah terbuka per operator</text>
    <rect x="950" y="96" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="118" text-anchor="middle" font-weight="bold" font-size="12">>Anti SSRF</text>
    <text x="1045" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Resolusi whitelist endpoint worker</text>

    <rect x="290" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="190" text-anchor="middle" font-weight="bold" font-size="11.5">>Isolasi kredensial</text>
    <text x="390" y="208" text-anchor="middle" font-size="11" fill="#6C757D">e-cat tak menyimpan kredensial teks biasa</text>
    <rect x="510" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="190" text-anchor="middle" font-weight="bold" font-size="11.5">>Proteksi kontrak internal</text>
    <text x="610" y="208" text-anchor="middle" font-size="11" fill="#6C757D">/internal hanya jaringan internal + header kunci bersama</text>
    <rect x="730" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="190" text-anchor="middle" font-weight="bold" font-size="11.5">>Kode error terpadu</text>
    <text x="830" y="208" text-anchor="middle" font-size="11" fill="#6C757D">carrier_error tak membocorkan detail internal</text>
    <rect x="950" y="168" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="190" text-anchor="middle" font-weight="bold" font-size="11.5">>Observabilitas</text>
    <text x="1045" y="208" text-anchor="middle" font-size="11" fill="#6C757D">/metrics · Log terstruktur · Tracing</text>
  </g>

  <!-- 第二层：应用层 -->
  <rect x="40" y="330" width="1120" height="280" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="330" width="220" height="280" rx="8" fill="#2E86DE"/>
  <text x="150" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Lapisan aplikasi</text>
  <text x="150" y="394" text-anchor="middle" font-size="12.5" fill="#E9F2FB">Admin backend (PHP)</text>
  <text x="150" y="414" text-anchor="middle" font-size="11" fill="#E9F2FB">18 lapis pertahanan mendalam</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="378" text-anchor="middle" font-weight="bold" font-size="12">>JWT + blacklist</text>
    <text x="390" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">2h access / 14d refresh</text>
    <rect x="510" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="378" text-anchor="middle" font-weight="bold" font-size="12">>Izin RBAC</text>
    <text x="610" y="396" text-anchor="middle" font-size="11" fill="#6C757D">Granularitas method.path + cache izin</text>
    <rect x="730" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="378" text-anchor="middle" font-weight="bold" font-size="11.5">>Audit operasi</text>
    <text x="830" y="396" text-anchor="middle" font-size="11" fill="#6C757D">Log seluruh rantai + deteksi sumber</text>
    <rect x="950" y="356" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="378" text-anchor="middle" font-weight="bold" font-size="11.5">>Filter keamanan</text>
    <text x="1045" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">Batasan metode HTTP / CSP</text>

    <rect x="290" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="450" text-anchor="middle" font-weight="bold" font-size="12">>XSS / SQL injection</text>
    <text x="390" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Diblokir SecurityFilter</text>
    <rect x="510" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="450" text-anchor="middle" font-weight="bold">CSRF</text>
    <text x="610" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Validasi token</text>
    <rect x="730" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="450" text-anchor="middle" font-weight="bold" font-size="11.5">>Command injection / path traversal</text>
    <text x="830" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Filter batas input</text>
    <rect x="950" y="428" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="450" text-anchor="middle" font-weight="bold" font-size="12">>Enkripsi Encryptable</text>
    <text x="1045" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Field sensitif disimpan ciphertext + masking</text>

    <rect x="290" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="522" text-anchor="middle" font-weight="bold" font-size="11.5">>Penguncian akun</text>
    <text x="390" y="540" text-anchor="middle" font-size="11" fill="#6C757D">5 kali gagal terkunci 15 menit</text>
    <rect x="510" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="522" text-anchor="middle" font-weight="bold" font-size="12">>CAPTCHA klik</text>
    <text x="610" y="540" text-anchor="middle" font-size="11" fill="#6C757D">Anti brute-force login</text>
    <rect x="730" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="522" text-anchor="middle" font-weight="bold" font-size="11.5">>Verifikasi signature callback</text>
    <text x="830" y="540" text-anchor="middle" font-size="11" fill="#6C757D">Signature HMAC + rute whitelist</text>
    <rect x="950" y="500" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="522" text-anchor="middle" font-weight="bold" font-size="11.5">>Keamanan kunci</text>
    <text x="1045" y="540" text-anchor="middle" font-size="11" fill="#6C757D">Injeksi variabel lingkungan · Nol hardcoded</text>
  </g>
</svg>
