<?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="42" text-anchor="middle" font-size="22.0" font-weight="bold" fill="#1F4E79">الأمان: دفاع متعمق متعدد الطبقات</text>

  <!-- 第一层：网关层 -->
  <rect x="40" y="70" width="1120" height="240" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="70" width="220" height="240" rx="8" fill="#1F4E79"/>
  <text x="150" y="110" text-anchor="middle" font-size="17.0" font-weight="bold" fill="#FFFFFF">طبقة البوابة</text>
  <text x="150" y="134" text-anchor="middle" font-size="12.5" fill="#D7E5F3">tracking-gateway (Rust)</text>
  <text x="150" y="154" text-anchor="middle" font-size="12.5" fill="#D7E5F3">خط الدفاع الأول</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">مصادقة API-Key</text>
    <text x="390" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">ترويسة X-API-Key؛ مفتاح مشفّر</text>
    <rect x="510" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">تحديد معدل Redis</text>
    <text x="610" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">نافذة منزلقة API-Key/IP</text>
    <rect x="730" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">قاطع الدائرة</text>
    <text x="830" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">half-open لكل شركة، فشل سريع</text>
    <rect x="950" y="96" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">حماية SSRF</text>
    <text x="1045" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">قائمة بيضاء لنقاط نهاية العمال</text>

    <rect x="290" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">عزل الاعتمادات</text>
    <text x="390" y="208" text-anchor="middle" font-size="11.5" fill="#6C757D">e-cat: بلا اعتمادات نصية</text>
    <rect x="510" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">حماية العقد الداخلي</text>
    <text x="610" y="208" text-anchor="middle" font-size="11.5" fill="#6C757D">/internal: إنترانت + مفتاح مشترك</text>
    <rect x="730" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">أكواد خطأ موحدة</text>
    <text x="830" y="208" text-anchor="middle" font-size="11.5" fill="#6C757D">carrier_error بلا تفاصيل داخلية</text>
    <rect x="950" y="168" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">المراقبة</text>
    <text x="1045" y="208" text-anchor="middle" font-size="11.5" fill="#6C757D">/metrics · سجلات منظمة · تتبّع</text>
  </g>

  <!-- 第二层：应用层 -->
  <rect x="40" y="330" width="1120" height="280" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="330" width="220" height="280" rx="8" fill="#2E86DE"/>
  <text x="150" y="370" text-anchor="middle" font-size="17.0" font-weight="bold" fill="#FFFFFF">طبقة التطبيق</text>
  <text x="150" y="394" text-anchor="middle" font-size="12.5" fill="#E9F2FB">لوحة الإدارة (PHP)</text>
  <text x="150" y="414" text-anchor="middle" font-size="12.5" fill="#E9F2FB">18 طبقة دفاع</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">JWT + قائمة سوداء</text>
    <text x="390" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">2h access / 14d refresh</text>
    <rect x="510" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">أذونات RBAC</text>
    <text x="610" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">دقة method.path + ذاكرة أذونات</text>
    <rect x="730" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">تدقيق العمليات</text>
    <text x="830" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">سجلات شاملة + كشف المصدر</text>
    <rect x="950" y="356" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">مرشّح أمان</text>
    <text x="1045" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">تقييد طرق HTTP / CSP</text>

    <rect x="290" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">XSS / حقن SQL</text>
    <text x="390" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">اعتراض عبر SecurityFilter</text>
    <rect x="510" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">CSRF</text>
    <text x="610" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">تحقق الرمز</text>
    <rect x="730" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">حقن أوامر / path traversal</text>
    <text x="830" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">ترشيح حدود الإدخال</text>
    <rect x="950" y="428" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">تشفير Encryptable</text>
    <text x="1045" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">حقول حساسة مشفّرة</text>

    <rect x="290" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">قفل الحساب</text>
    <text x="390" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">5 محاولات تفشل تقفل 15 دقيقة</text>
    <rect x="510" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">كابتشا النقر</text>
    <text x="610" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">حماية من القوة الغاشمة</text>
    <rect x="730" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">تحقق توقيع الاستدعاء</text>
    <text x="830" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">توقيع HMAC + مسار قائمة بيضاء</text>
    <rect x="950" y="500" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">أمان المفاتيح</text>
    <text x="1045" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">متغيرات بيئة · صفر مدمج</text>
  </g>
</svg>