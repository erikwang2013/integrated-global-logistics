    <text x="220" y="464" text-anchor="middle" font-size="13.5" fill="#212529">ذاكرة التخزين تجيب دون المرور بـ PHP</text>
    <text x="220" y="492" text-anchor="middle" font-size="13.5" fill="#212529">عمال بلا حالة وقابلون للتوسع الأفقي</text>
    <text x="220" y="528" text-anchor="middle" font-size="12.5" fill="#6C757D">عقد داخلي صغير: queryTrack + registry</text>
    <text x="220" y="558" text-anchor="middle" font-size="12.5" fill="#17A2B8">اقتران عبر اللغات مضبوط؛ الاعتمادات خارج البوابة</text>

    <rect x="420" y="354" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="420" y="354" width="360" height="10" rx="5" fill="#2E86DE"/>
    <text x="600" y="402" text-anchor="middle" font-size="18.0" font-weight="bold" fill="#1F4E79">حوكمة مرنة</text>
    <text x="600" y="436" text-anchor="middle" font-size="13.5" fill="#212529">ذاكرة Redis (TTL 5–60 دقيقة)</text>
    <text x="600" y="464" text-anchor="middle" font-size="13.5" fill="#212529">تحديد معدل بـ API-Key/IP (429)</text>
    <text x="600" y="492" text-anchor="middle" font-size="13.5" fill="#212529">قاطع دائرة لكل شركة (503)</text>
    <text x="600" y="520" text-anchor="middle" font-size="13.5" fill="#212529">موازنة أحمال RoundRobin</text>
    <text x="600" y="558" text-anchor="middle" font-size="12.5" fill="#17A2B8">RetryingClient مع محاولتين</text>

    <rect x="800" y="354" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="800" y="354" width="360" height="10" rx="5" fill="#17A2B8"/>
    <text x="980" y="402" text-anchor="middle" font-size="18.0" font-weight="bold" fill="#1F4E79">الأمن والامتثال</text>
    <text x="980" y="436" text-anchor="middle" font-size="13.5" fill="#212529">اعتمادات مشفّرة بـ Encryptable</text>
    <text x="980" y="464" text-anchor="middle" font-size="13.5" fill="#212529">تحقق HMAC للاستدعاءات</text>
    <text x="980" y="492" text-anchor="middle" font-size="13.5" fill="#212529">تدقيق شامل للعمليات</text>
    <text x="980" y="528" text-anchor="middle" font-size="12.5" fill="#6C757D">18 طبقة دفاع · صفر مفاتيح مدمجة</text>
    <text x="980" y="558" text-anchor="middle" font-size="12.5" fill="#17A2B8">واجهات داخلية: إنترانت + مفتاح مشترك</text>
  </g>
</svg>