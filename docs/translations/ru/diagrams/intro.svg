<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="48" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F4E79">Логистическая агрегационная платформа (Integrated Global Logistics)</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#212529">Админ-консоль · высокочастотный шлюз · единый фасад 209 перевозчиков — весь мир через одну точку входа</text>

  <!-- 支柱一：admin -->
  <g>
    <rect x="40" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="40" y="112" width="360" height="56" rx="8" fill="#1F4E79"/>
    <rect x="40" y="152" width="360" height="16" fill="#1F4E79"/>
    <text x="220" y="138" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">admin админ-консоль</text>
    <text x="220" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E86DE">PHP webman v2 постоянный процесс + Flutter</text>
    <text x="220" y="232" text-anchor="middle" font-size="13.5" fill="#212529">RBAC-права · JWT-аутентификация · аудит</text>
    <text x="220" y="264" text-anchor="middle" font-size="13.5" fill="#212529">Карточки перевозчиков / шифрованные ключи</text>
    <text x="220" y="296" text-anchor="middle" font-size="13" fill="#212529">Запросы / отчёты / подписки на колбэки</text>
    <text x="220" y="338" text-anchor="middle" font-size="13" fill="#6C757D">18 уровней защиты · экспорт Excel/PDF</text>
    <text x="220" y="368" text-anchor="middle" font-size="13" fill="#6C757D">Redis-кэш · поиск Elasticsearch</text>
    <text x="220" y="404" text-anchor="middle" font-size="13" fill="#17A2B8">Несёт управление и пул PHP worker</text>
  </g>

  <!-- 支柱二：tracking-gateway -->
  <g>
    <rect x="420" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="420" y="112" width="360" height="56" rx="8" fill="#2E86DE"/>
    <rect x="420" y="152" width="360" height="16" fill="#2E86DE"/>
    <text x="600" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">tracking-gateway высокочастотный шлюз</text>
    <text x="600" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E86DE">Постоянный процесс Rust e-cat</text>
    <text x="600" y="232" text-anchor="middle" font-size="13.5" fill="#212529">Попадание в кэш — сразу ответ (X-Cache: HIT)</text>
    <text x="600" y="264" text-anchor="middle" font-size="13.5" fill="#212529">API-Key аутентификация · лимит по ключу</text>
    <text x="600" y="296" text-anchor="middle" font-size="13.5" fill="#212529">Размыкание цепи по перевозчику</text>
    <text x="600" y="328" text-anchor="middle" font-size="13.5" fill="#212529">Балансировка RoundRobin по пулу worker</text>
    <text x="600" y="368" text-anchor="middle" font-size="13" fill="#6C757D">/metrics Prometheus · /health проверки</text>
    <text x="600" y="404" text-anchor="middle" font-size="13" fill="#17A2B8">Только высокочастотная плоскость, без протоколов</text>
  </g>

  <!-- 支柱三：global-logistics -->
  <g>
    <rect x="800" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="800" y="112" width="360" height="56" rx="8" fill="#17A2B8"/>
    <rect x="800" y="152" width="360" height="16" fill="#17A2B8"/>
    <text x="980" y="138" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">global-logistics единый фасад</text>
    <text x="980" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E86DE">PHP-адаптеры 209 перевозчиков</text>
    <text x="980" y="232" text-anchor="middle" font-size="13.5" fill="#212529">Logistics::track — единый вход, автопоиск</text>
    <text x="980" y="264" text-anchor="middle" font-size="13.5" fill="#212529">45 внутренних + 164 международных</text>
    <text x="980" y="296" text-anchor="middle" font-size="13.5" fill="#212529">187 правил трек-номеров (порядок важен)</text>
    <text x="980" y="328" text-anchor="middle" font-size="13.5" fill="#212529">TrackStatus: 7 единых семантик статуса</text>
    <text x="980" y="368" text-anchor="middle" font-size="13" fill="#6C757D">PSR-18 · OAuth2 · повтор при сбое</text>
    <text x="980" y="404" text-anchor="middle" font-size="13" fill="#17A2B8">1663 теста / 6662 проверки — все зелёные</text>
  </g>

  <!-- 底部数据条 -->
  <rect x="40" y="460" width="1120" height="140" rx="8" fill="#1F4E79"/>
  <text x="600" y="494" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Ключевые метрики</text>
  <g font-size="13" fill="#FFFFFF">
    <rect x="80" y="512" width="240" height="64" rx="8" fill="#2E86DE"/>
    <text x="200" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">209</text>
    <text x="200" y="560" text-anchor="middle" fill="#E9F2FB">Подключено перевозчиков</text>
    <rect x="340" y="512" width="240" height="64" rx="8" fill="#17A2B8"/>
    <text x="460" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">45 + 164</text>
    <text x="460" y="560" text-anchor="middle" fill="#E8F8FA">внутр. + междунар. каналы</text>
    <rect x="600" y="512" width="240" height="64" rx="8" fill="#2E86DE"/>
    <text x="720" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">187</text>
    <text x="720" y="560" text-anchor="middle" fill="#E9F2FB">правила автопоиска трек-номеров</text>
    <rect x="860" y="512" width="260" height="64" rx="8" fill="#17A2B8"/>
    <text x="990" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">7</text>
    <text x="990" y="560" text-anchor="middle" fill="#E8F8FA">единые семантики TrackStatus</text>
  </g>
<text x="1188" y="630" fill="rgba(33,37,41,0.35)" font-size="12" font-family="Arial, sans-serif" text-anchor="end">erik.xyz</text>
</svg>
