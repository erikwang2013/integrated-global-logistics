<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F4E79">Безопасность: эшелонированная защита</text>

  <!-- 第一层：网关层 -->
  <rect x="40" y="70" width="1120" height="240" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="70" width="220" height="240" rx="8" fill="#1F4E79"/>
  <text x="150" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Уровень шлюза</text>
  <text x="150" y="134" text-anchor="middle" font-size="12.5" fill="#D7E5F3">tracking-gateway (Rust)</text>
  <text x="150" y="154" text-anchor="middle" font-size="12.5" fill="#D7E5F3">Первый рубеж</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="118" text-anchor="middle" font-weight="bold">API-Key вход</text>
    <text x="390" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">X-API-Key, ключи зашифрованы</text>
    <rect x="510" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="118" text-anchor="middle" font-weight="bold">Redis-лимит</text>
    <text x="610" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">окно по API-Key / IP</text>
    <rect x="730" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="118" text-anchor="middle" font-weight="bold">Размыкание цепи</text>
    <text x="830" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">полуоткрытый быстрый отказ</text>
    <rect x="950" y="96" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="118" text-anchor="middle" font-weight="bold">Защита SSRF</text>
    <text x="1045" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">белый список эндпоинтов worker</text>

    <rect x="290" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="190" text-anchor="middle" font-weight="bold">Изоляция ключей</text>
    <text x="390" y="208" text-anchor="middle" font-size="11.5" fill="#6C757D">e-cat без открытых ключей</text>
    <rect x="510" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="190" text-anchor="middle" font-weight="bold">Защита контракта</text>
    <text x="610" y="208" text-anchor="middle" font-size="11.5" fill="#6C757D">/internal: интранет + секрет</text>
    <rect x="730" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="190" text-anchor="middle" font-weight="bold">Единые ошибки</text>
    <text x="830" y="208" text-anchor="middle" font-size="11.5" fill="#6C757D">carrier_error скрывает детали</text>
    <rect x="950" y="168" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="190" text-anchor="middle" font-weight="bold">Наблюдаемость</text>
    <text x="1045" y="208" text-anchor="middle" font-size="11.5" fill="#6C757D">/metrics · логи · трейсы</text>
  </g>

  <!-- 第二层：应用层 -->
  <rect x="40" y="330" width="1120" height="280" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="330" width="220" height="280" rx="8" fill="#2E86DE"/>
  <text x="150" y="370" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Уровень приложения</text>
  <text x="150" y="394" text-anchor="middle" font-size="12.5" fill="#E9F2FB">админ-консоль admin (PHP)</text>
  <text x="150" y="414" text-anchor="middle" font-size="12.5" fill="#E9F2FB">18 уровней защиты</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="378" text-anchor="middle" font-weight="bold">JWT + чёрный список</text>
    <text x="390" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">2h access / 14d refresh</text>
    <rect x="510" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="378" text-anchor="middle" font-weight="bold">Права RBAC</text>
    <text x="610" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">точность method.path + кэш</text>
    <rect x="730" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="378" text-anchor="middle" font-weight="bold">Аудит действий</text>
    <text x="830" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">логи всех звеньев + источник</text>
    <rect x="950" y="356" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="378" text-anchor="middle" font-weight="bold">Фильтр безопасности</text>
    <text x="1045" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">методы HTTP / CSP</text>

    <rect x="290" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="450" text-anchor="middle" font-weight="bold">XSS / SQL-инъекции</text>
    <text x="390" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">блокирует SecurityFilter</text>
    <rect x="510" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="450" text-anchor="middle" font-weight="bold">CSRF</text>
    <text x="610" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">проверка токена</text>
    <rect x="730" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="450" text-anchor="middle" font-weight="bold">Инъекции / обход путей</text>
    <text x="830" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">фильтрация на входе</text>
    <rect x="950" y="428" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="450" text-anchor="middle" font-weight="bold">Encryptable</text>
    <text x="1045" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">шифрование + маскирование</text>

    <rect x="290" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="522" text-anchor="middle" font-weight="bold">Блокировка входа</text>
    <text x="390" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">5 сбоев → 15 мин</text>
    <rect x="510" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="522" text-anchor="middle" font-weight="bold">Капча по клику</text>
    <text x="610" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">защита от перебора</text>
    <rect x="730" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="522" text-anchor="middle" font-weight="bold">Проверка колбэка</text>
    <text x="830" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">HMAC + белый список</text>
    <rect x="950" y="500" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="522" text-anchor="middle" font-weight="bold">Безопасность ключей</text>
    <text x="1045" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">из env · без хардкода</text>
  </g>
<text x="1188" y="630" fill="rgba(33,37,41,0.35)" font-size="12" font-family="Arial, sans-serif" text-anchor="end">erik.xyz</text>
</svg>
