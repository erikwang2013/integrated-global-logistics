  <line x1="850" y1="194" x2="850" y2="210" stroke="#6C757D" stroke-width="1.5"/>
  <line x1="790" y1="210" x2="910" y2="210" stroke="#6C757D" stroke-width="1.5"/>
  <line x1="790" y1="210" x2="790" y2="218" stroke="#6C757D" stroke-width="1.5"/>
  <line x1="910" y1="210" x2="910" y2="218" stroke="#6C757D" stroke-width="1.5"/>
  <rect x="776" y="218" width="128" height="44" rx="8" fill="#FFFFFF" stroke="#6C757D"/>
  <text x="840" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F4E79">diagrams/</text>
  <text x="840" y="254" text-anchor="middle" font-size="11" fill="#6C757D">Диаграммы архитектуры</text>
  <rect x="846" y="218" width="128" height="44" rx="8" fill="#FFFFFF" stroke="#6C757D"/>
  <text x="910" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F4E79">translations/</text>
  <text x="910" y="254" text-anchor="middle" font-size="11" fill="#6C757D">README на 12 языках</text>

  <!-- 底部注释 -->
  <rect x="80" y="300" width="940" height="150" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <text x="110" y="334" font-size="15" font-weight="bold" fill="#1F4E79">Роли компонентов</text>
  <text x="110" y="364" font-size="12" fill="#212529">admin — плоскость управления и пул PHP worker: карточки перевозчиков, шифрование ключей, запросы, подписки, права RBAC</text>
  <text x="110" y="392" font-size="12" fill="#212529">infrastructure — высокопроизводительная плоскость: e-cat переиспользует 209 PHP-адаптеров, Redis кэш/лимит/размыкание/балансировка</text>
  <text x="110" y="420" font-size="12" fill="#212529">docs — планы и визуализация: архитектура, потоки данных, безопасность, опора для переводов на 12 языков</text>

  <!-- 底部数据条 -->
  <rect x="80" y="480" width="940" height="110" rx="8" fill="#1F4E79"/>
  <text x="550" y="516" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Экосистема и качество</text>
  <g font-size="13" fill="#FFFFFF" text-anchor="middle">
    <rect x="120" y="536" width="200" height="36" rx="8" fill="#2E86DE"/>
    <text x="220" y="559" font-size="13.5" font-weight="bold">209 перевозчиков</text>
    <rect x="340" y="536" width="200" height="36" rx="8" fill="#17A2B8"/>
    <text x="440" y="559" font-size="13.5" font-weight="bold">187 правил номеров</text>
    <rect x="560" y="536" width="200" height="36" rx="8" fill="#2E86DE"/>
    <text x="660" y="559" font-size="13.5" font-weight="bold">1663 теста зелёные</text>
    <rect x="780" y="536" width="200" height="36" rx="8" fill="#17A2B8"/>
    <text x="880" y="559" font-size="13" font-weight="bold">55+ crates полный стек</text>
  </g>
