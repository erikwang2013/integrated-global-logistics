  <line x1="345" y1="210" x2="345" y2="218" stroke="#2E86DE" stroke-width="1.5"/>
  <rect x="96" y="218" width="118" height="44" rx="8" fill="#FFFFFF" stroke="#2E86DE"/>
  <text x="155" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F4E79">app/admin/controller</text>
  <text x="155" y="254" text-anchor="middle" font-size="11" fill="#6C757D">Контроллеры</text>
  <rect x="141" y="218" width="118" height="44" rx="8" fill="#FFFFFF" stroke="#2E86DE"/>
  <text x="200" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F4E79">app/model</text>
  <text x="200" y="254" text-anchor="middle" font-size="11" fill="#6C757D">Модели данных</text>
  <rect x="186" y="218" width="118" height="44" rx="8" fill="#FFFFFF" stroke="#2E86DE"/>
  <text x="245" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F4E79">app/middleware</text>
  <text x="245" y="254" text-anchor="middle" font-size="11" fill="#6C757D">Auth/лимит/аудит</text>
  <rect x="231" y="218" width="118" height="44" rx="8" fill="#FFFFFF" stroke="#2E86DE"/>
  <text x="290" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F4E79">config</text>
  <text x="290" y="254" text-anchor="middle" font-size="11" fill="#6C757D">Конфигурация</text>
