  <line x1="850" y1="132" x2="850" y2="140" stroke="#1F4E79" stroke-width="2"/>

  <!-- admin -->
  <rect x="80" y="140" width="340" height="54" rx="8" fill="#2E86DE"/>
  <text x="110" y="165" font-size="15" font-weight="bold" fill="#FFFFFF">admin/</text>
  <text x="110" y="184" font-size="12" fill="#E9F2FB">админ-консоль webman v2 + пул PHP worker</text>
  <line x1="250" y1="194" x2="250" y2="210" stroke="#2E86DE" stroke-width="1.5"/>
  <line x1="110" y1="210" x2="390" y2="210" stroke="#2E86DE" stroke-width="1.5"/>
  <line x1="110" y1="210" x2="110" y2="218" stroke="#2E86DE" stroke-width="1.5"/>
