<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="760" fill="#F8F9FA"/>
  <text x="550" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F4E79">Структура проекта (integrated-global-logistics)</text>

  <!-- 根节点 -->
  <rect x="330" y="66" width="440" height="46" rx="8" fill="#1F4E79"/>
  <text x="550" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">integrated-global-logistics/</text>

  <!-- 主干连线 -->
  <line x1="550" y1="112" x2="550" y2="132" stroke="#1F4E79" stroke-width="2"/>
  <line x1="250" y1="132" x2="850" y2="132" stroke="#1F4E79" stroke-width="2"/>
  <line x1="250" y1="132" x2="250" y2="140" stroke="#1F4E79" stroke-width="2"/>
