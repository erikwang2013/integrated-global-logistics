  <text x="410" y="184" font-size="12" fill="#E8F8FA">Rust e-cat микросервисный фреймворк + шлюз</text>
  <line x1="550" y1="194" x2="550" y2="210" stroke="#17A2B8" stroke-width="1.5"/>
  <line x1="410" y1="210" x2="690" y2="210" stroke="#17A2B8" stroke-width="1.5"/>
  <line x1="410" y1="210" x2="410" y2="218" stroke="#17A2B8" stroke-width="1.5"/>
  <line x1="467" y1="210" x2="467" y2="218" stroke="#17A2B8" stroke-width="1.5"/>
  <line x1="524" y1="210" x2="524" y2="218" stroke="#17A2B8" stroke-width="1.5"/>
  <line x1="604" y1="210" x2="604" y2="218" stroke="#17A2B8" stroke-width="1.5"/>
  <line x1="661" y1="210" x2="661" y2="218" stroke="#17A2B8" stroke-width="1.5"/>
  <rect x="396" y="218" width="142" height="44" rx="8" fill="#FFFFFF" stroke="#17A2B8"/>
  <text x="467" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F4E79">ecat</text>
  <text x="467" y="254" text-anchor="middle" font-size="11" fill="#6C757D">Сборочный crate</text>
  <rect x="410" y="218" width="142" height="44" rx="8" fill="#FFFFFF" stroke="#17A2B8"/>
  <text x="481" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F4E79">ecat-transport-http</text>
  <text x="481" y="254" text-anchor="middle" font-size="11" fill="#6C757D">axum HTTP-транспорт</text>
  <rect x="453" y="218" width="142" height="44" rx="8" fill="#FFFFFF" stroke="#17A2B8"/>
  <text x="524" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F4E79">ecat-data-redis</text>
  <text x="524" y="254" text-anchor="middle" font-size="11" fill="#6C757D">Кэш + хранение лимитов</text>
  <rect x="533" y="218" width="142" height="44" rx="8" fill="#FFFFFF" stroke="#17A2B8"/>
  <text x="604" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F4E79">ecat-client</text>
  <text x="604" y="254" text-anchor="middle" font-size="11" fill="#6C757D">Балансировка RoundRobin</text>
  <rect x="590" y="218" width="142" height="44" rx="8" fill="#FFFFFF" stroke="#17A2B8"/>
  <text x="661" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F4E79">tracking-gateway</text>
  <text x="661" y="254" text-anchor="middle" font-size="11" fill="#6C757D">Внешний шлюз запросов</text>

  <!-- docs -->
  <rect x="680" y="140" width="340" height="54" rx="8" fill="#6C757D"/>
  <text x="710" y="165" font-size="15" font-weight="bold" fill="#FFFFFF">docs/</text>
