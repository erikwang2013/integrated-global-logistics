    <text x="390" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">5회 실패 시 15분 잠금</text>
    <rect x="510" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="522" text-anchor="middle" font-weight="bold">클릭 캡차</text>
    <text x="610" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">무차별 공격 방지</text>
    <rect x="730" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="522" text-anchor="middle" font-weight="bold">콜백 서명 검증</text>
    <text x="830" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">HMAC + 화이트리스트</text>
    <rect x="950" y="500" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
