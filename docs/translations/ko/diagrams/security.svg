    <text x="390" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">X-API-Key, 키 암호화 저장</text>
    <rect x="510" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
