    <text x="610" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">API-Key/IP 슬라이딩 윈도우</text>
    <rect x="730" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
