    <rect x="950" y="428" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="450" text-anchor="middle" font-size="12.5" font-weight="bold">Encryptable 암호화</text>
    <text x="1045" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">암호 저장 + 마스킹</text>

    <rect x="290" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
