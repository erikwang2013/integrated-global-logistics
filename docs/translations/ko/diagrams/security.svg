<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F4E79">보안: 계층형 심층 방어</text>

  <!-- 第一层：网关层 -->
  <rect x="40" y="70" width="1120" height="240" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
