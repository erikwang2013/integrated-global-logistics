    <text x="390" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">SecurityFilter 차단</text>
    <rect x="510" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="450" text-anchor="middle" font-weight="bold">CSRF</text>
    <text x="610" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">토큰 검증</text>
    <rect x="730" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="450" text-anchor="middle" font-size="12.5" font-weight="bold">명령 주입 / 경로 탐색</text>
