<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">Seguridad: defensa en profundidad</text>

  <!-- 第一层：网关层 -->
  <rect x="40" y="70" width="1120" height="240" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="70" width="220" height="240" rx="8" fill="#1F4E79"/>
  <text x="150" y="110" text-anchor="middle" font-size="13.9" font-weight="bold" fill="#FFFFFF">Capa de pasarela</text>
  <text x="150" y="134" text-anchor="middle" font-size="12.5" fill="#D7E5F3">tracking-gateway (Rust)</text>
  <text x="150" y="154" text-anchor="middle" font-size="11" fill="#D7E5F3">Primera línea de defensa</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="118" text-anchor="middle" font-weight="bold">Auth API-Key</text>
    <text x="390" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Cabecera X-API-Key, claves cifradas</text>
    <rect x="510" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="118" text-anchor="middle" font-weight="bold">Rate-limit Redis</text>
    <text x="610" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Ventana deslizante API-Key/IP</text>
    <rect x="730" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="118" text-anchor="middle" font-weight="bold">Circuit breaker</text>
    <text x="830" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Half-open, fast-fail por transportista</text>
    <rect x="950" y="96" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="118" text-anchor="middle" font-weight="bold">Anti-SSRF</text>
    <text x="1045" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Resolución whitelist de endpoints de workers</text>

    <rect x="290" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="190" text-anchor="middle" font-weight="bold">Aislamiento de credenciales</text>
    <text x="390" y="208" text-anchor="middle" font-size="11" fill="#6C757D">e-cat no guarda credenciales en claro</text>
    <rect x="510" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="190" text-anchor="middle" font-weight="bold">Protección del contrato interno</text>
    <text x="610" y="208" text-anchor="middle" font-size="11" fill="#6C757D">/internal solo intranet + cabecera secreta</text>
    <rect x="730" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="190" text-anchor="middle" font-weight="bold">Códigos de error unificados</text>
    <text x="830" y="208" text-anchor="middle" font-size="11" fill="#6C757D">carrier_error sin detalles internos</text>
    <rect x="950" y="168" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="190" text-anchor="middle" font-weight="bold">Observabilidad</text>
    <text x="1045" y="208" text-anchor="middle" font-size="11" fill="#6C757D">/metrics · logs estructurados · tracing</text>
  </g>

  <!-- 第二层：应用层 -->
  <rect x="40" y="330" width="1120" height="280" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="330" width="220" height="280" rx="8" fill="#2E86DE"/>
  <text x="150" y="370" text-anchor="middle" font-size="13.9" font-weight="bold" fill="#FFFFFF">Capa de aplicación</text>
  <text x="150" y="394" text-anchor="middle" font-size="11" fill="#E9F2FB">admin backend de administración (PHP)</text>
  <text x="150" y="414" text-anchor="middle" font-size="11" fill="#E9F2FB">18 capas defensa en profundidad</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="378" text-anchor="middle" font-weight="bold">JWT + lista negra</text>
    <text x="390" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">2h access / 14d refresh</text>
    <rect x="510" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="378" text-anchor="middle" font-weight="bold">Permisos RBAC</text>
    <text x="610" y="396" text-anchor="middle" font-size="11" fill="#6C757D">Granularidad method.path + caché de permisos</text>
    <rect x="730" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="378" text-anchor="middle" font-weight="bold">Auditoría de operaciones</text>
    <text x="830" y="396" text-anchor="middle" font-size="11" fill="#6C757D">Logs de extremo a extremo + detección de origen</text>
    <rect x="950" y="356" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="378" text-anchor="middle" font-weight="bold">Filtros de seguridad</text>
    <text x="1045" y="396" text-anchor="middle" font-size="11" fill="#6C757D">Límite de métodos HTTP / CSP</text>

    <rect x="290" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="450" text-anchor="middle" font-weight="bold">XSS / inyección SQL</text>
    <text x="390" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Bloqueado por SecurityFilter</text>
    <rect x="510" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="450" text-anchor="middle" font-weight="bold">CSRF</text>
    <text x="610" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Validación de token</text>
    <rect x="730" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="450" text-anchor="middle" font-weight="bold">Inyección de comandos / path traversal</text>
    <text x="830" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Filtrado en los límites de entrada</text>
    <rect x="950" y="428" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="450" text-anchor="middle" font-weight="bold">Cifrado Encryptable</text>
    <text x="1045" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Campos sensibles cifrados + enmascarados</text>

    <rect x="290" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="522" text-anchor="middle" font-weight="bold">Bloqueo de cuenta</text>
    <text x="390" y="540" text-anchor="middle" font-size="11" fill="#6C757D">5 fallos → bloqueo 15 min</text>
    <rect x="510" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="522" text-anchor="middle" font-weight="bold">Captcha de clic</text>
    <text x="610" y="540" text-anchor="middle" font-size="11" fill="#6C757D">Anti fuerza bruta en login</text>
    <rect x="730" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="522" text-anchor="middle" font-weight="bold">Verificación de callbacks</text>
    <text x="830" y="540" text-anchor="middle" font-size="11" fill="#6C757D">Firma HMAC + ruta whitelist</text>
    <rect x="950" y="500" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="522" text-anchor="middle" font-weight="bold">Seguridad de claves</text>
    <text x="1045" y="540" text-anchor="middle" font-size="11" fill="#6C757D">Inyección por env vars · cero claves en código</text>
  </g>
</svg>
