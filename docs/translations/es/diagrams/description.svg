<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="44" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">Descripción: seis capacidades clave</text>
  <text x="600" y="72" text-anchor="middle" font-size="11.5" fill="#212529">Fachada unificada · auto-detección · estado unificado · pasarela de alto rendimiento · gobernanza elástica · seguridad</text>

  <!-- 卡片行一 -->
  <g>
    <rect x="40" y="104" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="40" y="104" width="360" height="10" rx="5" fill="#1F4E79"/>
    <text x="220" y="152" text-anchor="middle" font-size="14.8" font-weight="bold" fill="#1F4E79">Fachada unificada</text>
    <text x="220" y="186" text-anchor="middle" font-size="12.2" fill="#212529">Logistics::track: una entrada</text>
    <text x="220" y="214" text-anchor="middle" font-size="11.1" fill="#212529">Detecta canal y transportista</text>
    <text x="220" y="242" text-anchor="middle" font-size="11.1" fill="#212529">El negocio ignora las diferencias de protocolo</text>
    <text x="220" y="278" text-anchor="middle" font-size="11" fill="#6C757D">Firmas / OAuth2 / XML / JSON / mapeo de estados</text>
    <text x="220" y="308" text-anchor="middle" font-size="11" fill="#17A2B8">Un modelo de datos, una interfaz</text>

    <rect x="420" y="104" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="420" y="104" width="360" height="10" rx="5" fill="#2E86DE"/>
    <text x="600" y="152" text-anchor="middle" font-size="14.8" font-weight="bold" fill="#1F4E79">Auto-detección</text>
    <text x="600" y="186" text-anchor="middle" font-size="11.1" fill="#212529">187 reglas regex detectan canal y transportista</text>
    <text x="600" y="214" text-anchor="middle" font-size="11.1" fill="#212529">Sensible al orden, nacional primero</text>
    <text x="600" y="242" text-anchor="middle" font-size="11.1" fill="#212529">p. ej. STO «77» antes que reglas de 13 dígitos</text>
    <text x="600" y="278" text-anchor="middle" font-size="11.2" fill="#6C757D">Canal explícito: domestic / international</text>
    <text x="600" y="308" text-anchor="middle" font-size="11" fill="#17A2B8">Fallback por prioridad si no se reconoce</text>

    <rect x="800" y="104" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="800" y="104" width="360" height="10" rx="5" fill="#17A2B8"/>
    <text x="980" y="152" text-anchor="middle" font-size="14.8" font-weight="bold" fill="#1F4E79">Estado unificado</text>
    <text x="980" y="186" text-anchor="middle" font-size="12.2" fill="#212529">TrackStatus: 7 semánticas</text>
    <text x="980" y="214" text-anchor="middle" font-size="11" fill="#212529">Recogida → Transporte → Reparto → Entregado</text>
    <text x="980" y="242" text-anchor="middle" font-size="11.1" fill="#212529">Anomalía → EXCEPTION · devolución → RETURNED</text>
    <text x="980" y="278" text-anchor="middle" font-size="11" fill="#6C757D">No reconocido → UNKNOWN</text>
    <text x="980" y="308" text-anchor="middle" font-size="11" fill="#17A2B8"><tspan x="980">Estados brutos unificados; el negocio usa uno</tspan><tspan x="980" dy="13">solo</tspan></text>
  </g>

  <!-- 卡片行二 -->
  <g>
    <rect x="40" y="354" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="40" y="354" width="360" height="10" rx="5" fill="#1F4E79"/>
    <text x="220" y="402" text-anchor="middle" font-size="14.8" font-weight="bold" fill="#1F4E79">Pasarela de alto rendimiento</text>
    <text x="220" y="436" text-anchor="middle" font-size="11.1" fill="#212529">Daemon Rust e-cat de baja latencia</text>
    <text x="220" y="464" text-anchor="middle" font-size="11.1" fill="#212529">Hit de caché sin pasar por PHP</text>
    <text x="220" y="492" text-anchor="middle" font-size="11.1" fill="#212529">Workers sin estado, escalables</text>
    <text x="220" y="528" text-anchor="middle" font-size="11" fill="#6C757D">Contrato interno mínimo: queryTrack + registry</text>
    <text x="220" y="558" text-anchor="middle" font-size="11" fill="#17A2B8"><tspan x="220">Acoplamiento inter-lenguaje controlado, sin</tspan><tspan x="220" dy="13">credenciales</tspan></text>

    <rect x="420" y="354" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="420" y="354" width="360" height="10" rx="5" fill="#2E86DE"/>
    <text x="600" y="402" text-anchor="middle" font-size="14.8" font-weight="bold" fill="#1F4E79">Gobernanza elástica</text>
    <text x="600" y="436" text-anchor="middle" font-size="12.2" fill="#212529">Caché Redis (TTL 5–60 min)</text>
    <text x="600" y="464" text-anchor="middle" font-size="12.2" fill="#212529">Rate-limit API-Key/IP (429)</text>
    <text x="600" y="492" text-anchor="middle" font-size="11.1" fill="#212529">Circuit breaker por transportista (503 fast-fail)</text>
    <text x="600" y="520" text-anchor="middle" font-size="12.2" fill="#212529">Balanceo RoundRobin</text>
    <text x="600" y="558" text-anchor="middle" font-size="11.2" fill="#17A2B8">RetryingClient incluido: 2 reintentos</text>

    <rect x="800" y="354" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="800" y="354" width="360" height="10" rx="5" fill="#17A2B8"/>
    <text x="980" y="402" text-anchor="middle" font-size="14.8" font-weight="bold" fill="#1F4E79">Seguridad y cumplimiento</text>
    <text x="980" y="436" text-anchor="middle" font-size="11.1" fill="#212529">Credenciales cifradas con Encryptable</text>
    <text x="980" y="464" text-anchor="middle" font-size="11.1" fill="#212529">Verificación de firma HMAC en callbacks</text>
    <text x="980" y="492" text-anchor="middle" font-size="11.1" fill="#212529">Auditoría en toda la cadena</text>
    <text x="980" y="528" text-anchor="middle" font-size="11" fill="#6C757D"><tspan x="980">18 capas defensa en profundidad · cero claves en</tspan><tspan x="980" dy="13">código</tspan></text>
    <text x="980" y="558" text-anchor="middle" font-size="11" fill="#17A2B8"><tspan x="980">APIs internas: intranet + cabecera secreta</tspan><tspan x="980" dy="13">compartida</tspan></text>
  </g>
</svg>
