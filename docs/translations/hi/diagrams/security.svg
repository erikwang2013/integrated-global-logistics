<?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="42" text-anchor="middle" font-size="22.0" font-weight="bold" fill="#1F4E79">सुरक्षा: लेयर्ड डीप डिफेंस</text>

  <!-- 第一层：网关层 -->
  <rect x="40" y="70" width="1120" height="240" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="70" width="220" height="240" rx="8" fill="#1F4E79"/>
  <text x="150" y="110" text-anchor="middle" font-size="17.0" font-weight="bold" fill="#FFFFFF">गेटवे लेयर</text>
  <text x="150" y="134" text-anchor="middle" font-size="12.5" fill="#D7E5F3">tracking-gateway (Rust)</text>
  <text x="150" y="154" text-anchor="middle" font-size="12.5" fill="#D7E5F3">पहली सुरक्षा पंक्ति</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">API-Key प्रमाणीकरण</text>
    <text x="390" y="136" text-anchor="middle" font-size="11.0" fill="#6C757D">X-API-Key हेडर; एन्क्रिप्टेड कुंजी</text>
    <rect x="510" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">Redis रेट लिमिट</text>
    <text x="610" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">API-Key/IP स्लाइडिंग विंडो</text>
    <rect x="730" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">सर्किट ब्रेकर</text>
    <text x="830" y="136" text-anchor="middle" font-size="11.0" fill="#6C757D">प्रति-कैरियर half-open, फ़ास्ट फ़ेल</text>
    <rect x="950" y="96" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">SSRF सुरक्षा</text>
    <text x="1045" y="136" text-anchor="middle" font-size="11.5" fill="#6C757D">वर्कर एंडपॉइंट व्हाइटलिस्ट</text>

    <rect x="290" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">क्रेडेंशियल अलगाव</text>
    <text x="390" y="208" text-anchor="middle" font-size="11.0" fill="#6C757D">e-cat: प्लेनटेक्स्ट क्रेडेंशियल नहीं</text>
    <rect x="510" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">इंटरनल कॉन्ट्रैक्ट सुरक्षा</text>
    <text x="610" y="208" text-anchor="middle" font-size="11.0" fill="#6C757D">/internal: इंट्रानेट + शेयर्ड कुंजी</text>
    <rect x="730" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">एकीकृत एरर कोड</text>
    <text x="830" y="208" text-anchor="middle" font-size="11.3" fill="#6C757D">carrier_error: आंतरिक विवरण नहीं</text>
    <rect x="950" y="168" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">ऑब्ज़र्वेबिलिटी</text>
    <text x="1045" y="208" text-anchor="middle" font-size="11.0" fill="#6C757D">/metrics · स्ट्रक्चर्ड लॉग · ट्रेसिंग</text>
  </g>

  <!-- 第二层：应用层 -->
  <rect x="40" y="330" width="1120" height="280" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="330" width="220" height="280" rx="8" fill="#2E86DE"/>
  <text x="150" y="370" text-anchor="middle" font-size="17.0" font-weight="bold" fill="#FFFFFF">एप्लिकेशन लेयर</text>
  <text x="150" y="394" text-anchor="middle" font-size="12.5" fill="#E9F2FB">एडमिन पैनल (PHP)</text>
  <text x="150" y="414" text-anchor="middle" font-size="12.5" fill="#E9F2FB">18-परत डीप डिफेंस</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">JWT + ब्लैकलिस्ट</text>
    <text x="390" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">2h access / 14d refresh</text>
    <rect x="510" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">RBAC अनुमतियाँ</text>
    <text x="610" y="396" text-anchor="middle" font-size="11.0" fill="#6C757D">method.path ग्रैन्युलैरिटी + कैश</text>
    <rect x="730" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">ऑपरेशन ऑडिट</text>
    <text x="830" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">एंड-टू-एंड लॉग + स्रोत पहचान</text>
    <rect x="950" y="356" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">सुरक्षा फ़िल्टर</text>
    <text x="1045" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">HTTP मेथड सीमा / CSP</text>

    <rect x="290" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">XSS / SQL इंजेक्शन</text>
    <text x="390" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">SecurityFilter इंटरसेप्ट</text>
    <rect x="510" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">CSRF</text>
    <text x="610" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">टोकन जाँच</text>
    <rect x="730" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">कमांड इंजेक्शन / path</text>
    <text x="830" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">इनपुट बाउंड्री फ़िल्टर</text>
    <rect x="950" y="428" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">Encryptable एन्क्रिप्शन</text>
    <text x="1045" y="468" text-anchor="middle" font-size="11.2" fill="#6C757D">संवेदनशील फ़ील्ड एन्क्रिप्टेड</text>

    <rect x="290" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">खाता लॉक</text>
    <text x="390" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">5 असफलता पर 15 मिनट लॉक</text>
    <rect x="510" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">क्लिक कैप्चा</text>
    <text x="610" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">ब्रूट-फ़ोर्स सुरक्षा</text>
    <rect x="730" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">कॉलबैक सिग्नेचर जाँच</text>
    <text x="830" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">HMAC सिग्नेचर + व्हाइटलिस्ट</text>
    <rect x="950" y="500" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">कुंजी सुरक्षा</text>
    <text x="1045" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">एनवी वेरिएबल · ज़ीरो हार्डकोड</text>
  </g>
<text x="1188" y="630" fill="rgba(33,37,41,0.35)" font-size="12" font-family="Arial, sans-serif" text-anchor="end">erik.xyz</text>
</svg>