<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">Sicherheit: Mehrschichtige Defense-in-Depth</text>

  <!-- 第一层：网关层 -->
  <rect x="40" y="70" width="1120" height="240" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="70" width="220" height="240" rx="8" fill="#1F4E79"/>
  <text x="150" y="110" text-anchor="middle" font-size="13.9" font-weight="bold" fill="#FFFFFF">Gateway-Ebene</text>
  <text x="150" y="134" text-anchor="middle" font-size="12.5" fill="#D7E5F3">tracking-gateway (Rust)</text>
  <text x="150" y="154" text-anchor="middle" font-size="11" fill="#D7E5F3">Erste Verteidigungslinie</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="118" text-anchor="middle" font-weight="bold">API-Key-Auth</text>
    <text x="390" y="136" text-anchor="middle" font-size="11" fill="#6C757D">X-API-Key-Header, Keys verschlüsselt</text>
    <rect x="510" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="118" text-anchor="middle" font-weight="bold">Redis-Rate-Limit</text>
    <text x="610" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Sliding Window je API-Key/IP</text>
    <rect x="730" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="118" text-anchor="middle" font-weight="bold">Circuit Breaker</text>
    <text x="830" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Half-Open-Probe, Fast-Fail je Carrier</text>
    <rect x="950" y="96" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="118" text-anchor="middle" font-weight="bold">SSRF-Schutz</text>
    <text x="1045" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Whitelist-Auflösung der Worker-Endpunkte</text>

    <rect x="290" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="190" text-anchor="middle" font-weight="bold">Credential-Isolation</text>
    <text x="390" y="208" text-anchor="middle" font-size="11" fill="#6C757D">e-cat hält keine Klartext-Credentials</text>
    <rect x="510" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="190" text-anchor="middle" font-weight="bold">Interner Contract-Schutz</text>
    <text x="610" y="208" text-anchor="middle" font-size="11" fill="#6C757D">/internal nur intern + Shared-Secret-Header</text>
    <rect x="730" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="190" text-anchor="middle" font-weight="bold">Einheitliche Fehlercodes</text>
    <text x="830" y="208" text-anchor="middle" font-size="11" fill="#6C757D">carrier_error ohne interne Details</text>
    <rect x="950" y="168" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="190" text-anchor="middle" font-weight="bold">Observability</text>
    <text x="1045" y="208" text-anchor="middle" font-size="11" fill="#6C757D">/metrics · strukturierte Logs · Tracing</text>
  </g>

  <!-- 第二层：应用层 -->
  <rect x="40" y="330" width="1120" height="280" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="330" width="220" height="280" rx="8" fill="#2E86DE"/>
  <text x="150" y="370" text-anchor="middle" font-size="13.9" font-weight="bold" fill="#FFFFFF">Applikationsebene</text>
  <text x="150" y="394" text-anchor="middle" font-size="11" fill="#E9F2FB">admin Admin-Backend (PHP)</text>
  <text x="150" y="414" text-anchor="middle" font-size="11" fill="#E9F2FB">18 Ebenen Defense-in-Depth</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="378" text-anchor="middle" font-weight="bold">JWT + Blacklist</text>
    <text x="390" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">2h access / 14d refresh</text>
    <rect x="510" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="378" text-anchor="middle" font-weight="bold">RBAC-Rechte</text>
    <text x="610" y="396" text-anchor="middle" font-size="11" fill="#6C757D">method.path-Granularität + Rechte-Cache</text>
    <rect x="730" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="378" text-anchor="middle" font-weight="bold">Audit-Trail</text>
    <text x="830" y="396" text-anchor="middle" font-size="11" fill="#6C757D">Kettenweite Logs + Quellen-Erkennung</text>
    <rect x="950" y="356" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="378" text-anchor="middle" font-weight="bold">Security-Filter</text>
    <text x="1045" y="396" text-anchor="middle" font-size="11" fill="#6C757D">HTTP-Methoden-Limit / CSP</text>

    <rect x="290" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="450" text-anchor="middle" font-weight="bold">XSS / SQL-Injection</text>
    <text x="390" y="468" text-anchor="middle" font-size="11" fill="#6C757D">SecurityFilter blockiert</text>
    <rect x="510" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="450" text-anchor="middle" font-weight="bold">CSRF</text>
    <text x="610" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Token-Prüfung</text>
    <rect x="730" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="450" text-anchor="middle" font-weight="bold">Command-Injection / Path-Traversal</text>
    <text x="830" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Eingabegrenzen-Filterung</text>
    <rect x="950" y="428" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="450" text-anchor="middle" font-weight="bold">Encryptable-Verschlüsselung</text>
    <text x="1045" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Sensible Felder verschlüsselt + maskiert</text>

    <rect x="290" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="522" text-anchor="middle" font-weight="bold">Kontosperre</text>
    <text x="390" y="540" text-anchor="middle" font-size="11" fill="#6C757D">5 Fehlversuche → 15 min Sperre</text>
    <rect x="510" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="522" text-anchor="middle" font-weight="bold">Click-Captcha</text>
    <text x="610" y="540" text-anchor="middle" font-size="11" fill="#6C757D">Brute-Force-Schutz beim Login</text>
    <rect x="730" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="522" text-anchor="middle" font-weight="bold">Callback-Verifikation</text>
    <text x="830" y="540" text-anchor="middle" font-size="11" fill="#6C757D">HMAC-Signatur + Whitelist-Route</text>
    <rect x="950" y="500" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="522" text-anchor="middle" font-weight="bold">Schlüsselsicherheit</text>
    <text x="1045" y="540" text-anchor="middle" font-size="11" fill="#6C757D">Env-var-Injection · keine Hardcoding</text>
  </g>
<text x="1188" y="630" fill="rgba(33,37,41,0.35)" font-size="12" font-family="Arial, sans-serif" text-anchor="end">erik.xyz</text>
</svg>
