<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="48" text-anchor="middle" font-size="19.7" font-weight="bold" fill="#1F4E79">Logistik-Aggregationsplattform (Integrated Global Logistics)</text>
  <text x="600" y="78" text-anchor="middle" font-size="12.3" fill="#212529">Admin-Backend · Hochfrequenz-Gateway · Einheitliche Fassade für 209 Carrier – ein Einstieg für die ganze Welt</text>

  <!-- 支柱一：admin -->
  <g>
    <rect x="40" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="40" y="112" width="360" height="56" rx="8" fill="#1F4E79"/>
    <rect x="40" y="152" width="360" height="16" fill="#1F4E79"/>
    <text x="220" y="138" text-anchor="middle" font-size="16.4" font-weight="bold" fill="#FFFFFF">admin Admin-Backend</text>
    <text x="220" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E86DE">PHP-webman-v2-Daemon + Flutter-Admin</text>
    <text x="220" y="232" text-anchor="middle" font-size="11.1" fill="#212529">RBAC-Rechte · JWT-Auth · Audit-Trail</text>
    <text x="220" y="264" text-anchor="middle" font-size="11.1" fill="#212529">Carrier-Profile / verschlüsselte Schlüssel</text>
    <text x="220" y="296" text-anchor="middle" font-size="11.1" fill="#212529">Abfrageprotokoll / Statistiken / Callback-Abos</text>
    <text x="220" y="338" text-anchor="middle" font-size="11" fill="#6C757D">18 Ebenen Defense-in-Depth · Excel/PDF-Export</text>
    <text x="220" y="368" text-anchor="middle" font-size="11.7" fill="#6C757D">Redis-Cache · Elasticsearch-Suche</text>
    <text x="220" y="404" text-anchor="middle" font-size="11" fill="#17A2B8">Admin-Oberfläche &amp; PHP-Worker-Pool</text>
  </g>

  <!-- 支柱二：tracking-gateway -->
  <g>
    <rect x="420" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="420" y="112" width="360" height="56" rx="8" fill="#2E86DE"/>
    <rect x="420" y="152" width="360" height="16" fill="#2E86DE"/>
    <text x="600" y="138" text-anchor="middle" font-size="15.1" font-weight="bold" fill="#FFFFFF"><tspan x="600">tracking-gateway</tspan><tspan x="600" dy="13">Hochfrequenz-Gateway</tspan></text>
    <text x="600" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2E86DE">Rust-e-cat-Framework-Daemon</text>
    <text x="600" y="232" text-anchor="middle" font-size="11.1" fill="#212529">Redis-Cache-Treffer sofort zurück (X-Cache: HIT)</text>
    <text x="600" y="264" text-anchor="middle" font-size="11.1" fill="#212529">API-Key-Auth · Rate-Limit je Key</text>
    <text x="600" y="296" text-anchor="middle" font-size="11.1" fill="#212529">Circuit Breaker je Carrier (Half-Open)</text>
    <text x="600" y="328" text-anchor="middle" font-size="11.1" fill="#212529">RoundRobin-Lastverteilung auf Worker-Pool</text>
    <text x="600" y="368" text-anchor="middle" font-size="11.7" fill="#6C757D">/metrics Prometheus · /health Healthcheck</text>
    <text x="600" y="404" text-anchor="middle" font-size="11" fill="#17A2B8"><tspan x="600">Nur High-Frequency-Ebene, kennt keine</tspan><tspan x="600" dy="13">Carrier-Protokolle</tspan></text>
  </g>

  <!-- 支柱三：global-logistics -->
  <g>
    <rect x="800" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="800" y="112" width="360" height="56" rx="8" fill="#17A2B8"/>
    <rect x="800" y="152" width="360" height="16" fill="#17A2B8"/>
    <text x="980" y="138" text-anchor="middle" font-size="15.1" font-weight="bold" fill="#FFFFFF"><tspan x="980">global-logistics Einheitliche</tspan><tspan x="980" dy="13">Fassade</tspan></text>
    <text x="980" y="196" text-anchor="middle" font-size="12.6" font-weight="bold" fill="#2E86DE">209 Carrier-PHP-Adapter</text>
    <text x="980" y="232" text-anchor="middle" font-size="11.1" fill="#212529">Logistics::track – ein Einstieg, Auto-Erkennung</text>
    <text x="980" y="264" text-anchor="middle" font-size="11.1" fill="#212529">Inland 45 + International 164</text>
    <text x="980" y="296" text-anchor="middle" font-size="11.1" fill="#212529">187 Sendungsnummern-Regeln (reihenfolgesensitiv)</text>
    <text x="980" y="328" text-anchor="middle" font-size="11.1" fill="#212529">TrackStatus – 7 einheitliche Status-Semantiken</text>
    <text x="980" y="368" text-anchor="middle" font-size="11" fill="#6C757D">PSR-18 · OAuth2 · Auto-Retry bei Fehlern</text>
    <text x="980" y="404" text-anchor="middle" font-size="11.7" fill="#17A2B8">1663 Tests / 6662 Asserts grün</text>
  </g>

  <!-- 底部数据条 -->
  <rect x="40" y="460" width="1120" height="140" rx="8" fill="#1F4E79"/>
  <text x="600" y="494" text-anchor="middle" font-size="13.1" font-weight="bold" fill="#FFFFFF">Kernkennzahlen</text>
  <g font-size="13" fill="#FFFFFF">
    <rect x="80" y="512" width="240" height="64" rx="8" fill="#2E86DE"/>
    <text x="200" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">209</text>
    <text x="200" y="560" text-anchor="middle" fill="#E9F2FB">integrierte Carrier</text>
    <rect x="340" y="512" width="240" height="64" rx="8" fill="#17A2B8"/>
    <text x="460" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">45 + 164</text>
    <text x="460" y="560" text-anchor="middle" fill="#E8F8FA">Inland + International</text>
    <rect x="600" y="512" width="240" height="64" rx="8" fill="#2E86DE"/>
    <text x="720" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">187</text>
    <text x="720" y="560" text-anchor="middle" fill="#E9F2FB">Sendungsnummern-Regeln</text>
    <rect x="860" y="512" width="260" height="64" rx="8" fill="#17A2B8"/>
    <text x="990" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">7</text>
    <text x="990" y="560" text-anchor="middle" fill="#E8F8FA">einheitliche Status TrackStatus</text>
  </g>
</svg>
