<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="48" text-anchor="middle" font-size="23" font-weight="bold" fill="#1F4E79">物流統合プラットフォーム（Integrated Global Logistics）</text>
  <text x="600" y="78" text-anchor="middle" font-size="14" fill="#212529">管理バックエンド・高頻度ゲートウェイ・209社の統一フェース —— 一つの入口で全世界を検索</text>

  <!-- 支柱一：admin -->
  <g>
    <rect x="40" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="40" y="112" width="360" height="56" rx="8" fill="#1F4E79"/>
    <rect x="40" y="152" width="360" height="16" fill="#1F4E79"/>
    <text x="220" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">admin 管理バックエンド</text>
    <text x="220" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E86DE">PHP webman v2 常駐プロセス + Flutter 管理画面</text>
    <text x="220" y="232" text-anchor="middle" font-size="13.5" fill="#212529">RBAC 権限・JWT 認証・操作監査</text>
    <text x="220" y="264" text-anchor="middle" font-size="12.5" fill="#212529">運送会社マスタ / キーの暗号化管理</text>
    <text x="220" y="296" text-anchor="middle" font-size="12.5" fill="#212529">クエリ記録 / 統計レポート / コールバック購読</text>
    <text x="220" y="338" text-anchor="middle" font-size="12" fill="#6C757D">18層の防御・Excel/PDF エクスポート</text>
    <text x="220" y="368" text-anchor="middle" font-size="12" fill="#6C757D">Redis キャッシュ・Elasticsearch 検索</text>
    <text x="220" y="404" text-anchor="middle" font-size="12" fill="#17A2B8">管理面と PHP worker プールを担当</text>
  </g>

  <!-- 支柱二：tracking-gateway -->
  <g>
    <rect x="420" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="420" y="112" width="360" height="56" rx="8" fill="#2E86DE"/>
    <rect x="420" y="152" width="360" height="16" fill="#2E86DE"/>
    <text x="600" y="138" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">tracking-gateway 高頻度ゲートウェイ</text>
    <text x="600" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E86DE">Rust e-cat フレームワーク常駐プロセス</text>
    <text x="600" y="232" text-anchor="middle" font-size="12.5" fill="#212529">Redis キャッシュヒット即返却（X-Cache: HIT）</text>
    <text x="600" y="264" text-anchor="middle" font-size="12.5" fill="#212529">API-Key 認証・key 別レート制限</text>
    <text x="600" y="296" text-anchor="middle" font-size="11.5" fill="#212529">運送会社別サーキットブレーカー（半開プローブ）</text>
    <text x="600" y="328" text-anchor="middle" font-size="12.5" fill="#212529">RoundRobin で worker プールへ負荷分散</text>
    <text x="600" y="368" text-anchor="middle" font-size="12" fill="#6C757D">/metrics Prometheus・/health ヘルスチェック</text>
    <text x="600" y="404" text-anchor="middle" font-size="11" fill="#17A2B8">高頻度面のみ、運送会社プロトコルは理解しない</text>
  </g>

  <!-- 支柱三：global-logistics -->
  <g>
    <rect x="800" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="800" y="112" width="360" height="56" rx="8" fill="#17A2B8"/>
    <rect x="800" y="152" width="360" height="16" fill="#17A2B8"/>
    <text x="980" y="138" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">global-logistics 統一フェース</text>
    <text x="980" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E86DE">209社の運送会社 PHP アダプター</text>
    <text x="980" y="232" text-anchor="middle" font-size="12.5" fill="#212529">Logistics::track 一つの入口で自動識別</text>
    <text x="980" y="264" text-anchor="middle" font-size="13.5" fill="#212529">国内 45社 + 国際 164社</text>
    <text x="980" y="296" text-anchor="middle" font-size="12.5" fill="#212529">187件の追跡番号ルール（順序優先ヒット）</text>
    <text x="980" y="328" text-anchor="middle" font-size="12.5" fill="#212529">TrackStatus 7種の統一ステータス意味論</text>
    <text x="980" y="368" text-anchor="middle" font-size="12" fill="#6C757D">PSR-18・OAuth2・失敗時自動リトライ</text>
    <text x="980" y="404" text-anchor="middle" font-size="12" fill="#17A2B8">1663テストケース / 6662アサーション全緑</text>
  </g>

  <!-- 底部数据条 -->
  <rect x="40" y="460" width="1120" height="140" rx="8" fill="#1F4E79"/>
  <text x="600" y="494" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">主要指標</text>
  <g font-size="13" fill="#FFFFFF">
    <rect x="80" y="512" width="240" height="64" rx="8" fill="#2E86DE"/>
    <text x="200" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">209社</text>
    <text x="200" y="560" text-anchor="middle" fill="#E9F2FB" font-size="12">>接続済み運送会社</text>
    <rect x="340" y="512" width="240" height="64" rx="8" fill="#17A2B8"/>
    <text x="460" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">45 + 164</text>
    <text x="460" y="560" text-anchor="middle" fill="#E8F8FA" font-size="12">>国内 + 国際チャネル</text>
    <rect x="600" y="512" width="240" height="64" rx="8" fill="#2E86DE"/>
    <text x="720" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">187件</text>
    <text x="720" y="560" text-anchor="middle" fill="#E9F2FB" font-size="12">>追跡番号自動識別ルール</text>
    <rect x="860" y="512" width="260" height="64" rx="8" fill="#17A2B8"/>
    <text x="990" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">7種</text>
    <text x="990" y="560" text-anchor="middle" fill="#E8F8FA" font-size="12">>統一ステータス TrackStatus</text>
  </g>
<text x="1188" y="630" fill="rgba(33,37,41,0.35)" font-size="12" font-family="Arial, sans-serif" text-anchor="end">erik.xyz</text>
</svg>
