  <line x1="790" y1="210" x2="910" y2="210" stroke="#6C757D" stroke-width="1.5"/>
  <line x1="790" y1="210" x2="790" y2="218" stroke="#6C757D" stroke-width="1.5"/>
  <line x1="910" y1="210" x2="910" y2="218" stroke="#6C757D" stroke-width="1.5"/>
  <rect x="776" y="218" width="128" height="44" rx="8" fill="#FFFFFF" stroke="#6C757D"/>
  <text x="840" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F4E79">diagrams/</text>
  <text x="840" y="254" text-anchor="middle" font-size="11" fill="#6C757D">SVG アーキテクチャ図（本ディレクトリ）</text>
  <rect x="846" y="218" width="128" height="44" rx="8" fill="#FFFFFF" stroke="#6C757D"/>
