  <rect x="141" y="218" width="118" height="44" rx="8" fill="#FFFFFF" stroke="#2E86DE"/>
  <text x="200" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F4E79">app/model</text>
  <text x="200" y="254" text-anchor="middle" font-size="11" fill="#6C757D">データモデル</text>
