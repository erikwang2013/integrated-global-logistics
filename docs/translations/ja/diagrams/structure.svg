    <rect x="340" y="536" width="200" height="36" rx="8" fill="#17A2B8"/>
    <text x="440" y="559" font-size="12.5" font-weight="bold">187件の追跡番号ルール</text>
    <rect x="560" y="536" width="200" height="36" rx="8" fill="#2E86DE"/>
    <text x="660" y="559" font-size="12.5" font-weight="bold">1663テストケース全緑</text>
    <rect x="780" y="536" width="200" height="36" rx="8" fill="#17A2B8"/>
    <text x="880" y="559" font-size="11.5" font-weight="bold">55+ crates フルスタックフレームワーク</text>
