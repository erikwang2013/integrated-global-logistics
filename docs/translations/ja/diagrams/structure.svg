  <text x="910" y="254" text-anchor="middle" font-size="11" fill="#6C757D">12言語の README</text>

  <!-- 底部注释 -->
  <rect x="80" y="300" width="940" height="150" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <text x="110" y="334" font-size="13" font-weight="bold" fill="#1F4E79">コンポーネントの役割</text>
  <text x="110" y="364" font-size="12.5" fill="#212529">admin —— 管理面と PHP worker プール：運送会社マスタ、キー暗号化、クエリ記録、コールバック購読、RBAC 権限</text>
  <text x="110" y="392" font-size="12.5" fill="#212529">infrastructure —— 高性能面：e-cat ゲートウェイが 209社の PHP アダプターを再利用、Redis キャッシュ/レート制限/サーキットブレーカー/負荷分散</text>
  <text x="110" y="420" font-size="12.5" fill="#212529">docs —— 計画ドキュメントと可視化：アーキテクチャ、データフロー、セキュリティ設計、12言語の翻訳対照用</text>

  <!-- 底部数据条 -->
  <rect x="80" y="480" width="940" height="110" rx="8" fill="#1F4E79"/>
  <text x="550" y="516" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">エコシステムと品質</text>
  <g font-size="13" fill="#FFFFFF" text-anchor="middle">
    <rect x="120" y="536" width="200" height="36" rx="8" fill="#2E86DE"/>
