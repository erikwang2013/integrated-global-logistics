<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="42" text-anchor="middle" font-size="21" font-weight="bold" fill="#1F4E79">セキュリティ：層状の深層防御</text>

  <!-- 第一层：网关层 -->
  <rect x="40" y="70" width="1120" height="240" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="70" width="220" height="240" rx="8" fill="#1F4E79"/>
  <text x="150" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">ゲートウェイ層</text>
  <text x="150" y="134" text-anchor="middle" font-size="12.5" fill="#D7E5F3">tracking-gateway（Rust）</text>
  <text x="150" y="154" text-anchor="middle" font-size="11.5" fill="#D7E5F3">第一の防衛線</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="118" text-anchor="middle" font-weight="bold">API-Key 認証</text>
    <text x="390" y="136" text-anchor="middle" font-size="11" fill="#6C757D">X-API-Key ヘッダー、key は暗号化保存</text>
    <rect x="510" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="118" text-anchor="middle" font-weight="bold" font-size="11.5">>Redis レート制限</text>
    <text x="610" y="136" text-anchor="middle" font-size="11" fill="#6C757D">API-Key / IP 別スライディングウィンドウ</text>
    <rect x="730" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="118" text-anchor="middle" font-weight="bold" font-size="11.5">>サーキットブレーカー</text>
    <text x="830" y="136" text-anchor="middle" font-size="11" fill="#6C757D">運送会社別に半開プローブでファストフェイル</text>
    <rect x="950" y="96" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="118" text-anchor="middle" font-weight="bold" font-size="12">>SSRF 対策</text>
    <text x="1045" y="136" text-anchor="middle" font-size="11" fill="#6C757D">worker エンドポイントのホワイトリスト解決</text>

    <rect x="290" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="190" text-anchor="middle" font-weight="bold" font-size="11.5">>クレデンシャル分離</text>
    <text x="390" y="208" text-anchor="middle" font-size="11" fill="#6C757D">e-cat はクレデンシャル平文を保持しない</text>
    <rect x="510" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="190" text-anchor="middle" font-weight="bold" font-size="12">>内部契約の保護</text>
    <text x="610" y="208" text-anchor="middle" font-size="11" fill="#6C757D">/internal は内網のみ + 共有キーヘッダー</text>
    <rect x="730" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="190" text-anchor="middle" font-weight="bold" font-size="11.5">>統一エラーコード</text>
    <text x="830" y="208" text-anchor="middle" font-size="11" fill="#6C757D">carrier_error で内部詳細を漏らさない</text>
    <rect x="950" y="168" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="190" text-anchor="middle" font-weight="bold" font-size="12">>可観測性</text>
    <text x="1045" y="208" text-anchor="middle" font-size="11" fill="#6C757D">/metrics・構造化ログ・トレーシング</text>
  </g>

  <!-- 第二层：应用层 -->
  <rect x="40" y="330" width="1120" height="280" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="330" width="220" height="280" rx="8" fill="#2E86DE"/>
  <text x="150" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">アプリケーション層</text>
  <text x="150" y="394" text-anchor="middle" font-size="11.5" fill="#E9F2FB">admin 管理バックエンド（PHP）</text>
  <text x="150" y="414" text-anchor="middle" font-size="11.5" fill="#E9F2FB">18層の深層防御</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="378" text-anchor="middle" font-weight="bold" font-size="11.5">>JWT + ブラックリスト</text>
    <text x="390" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">2h access / 14d refresh</text>
    <rect x="510" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="378" text-anchor="middle" font-weight="bold">RBAC 権限</text>
    <text x="610" y="396" text-anchor="middle" font-size="11" fill="#6C757D">method.path 粒度 + 権限キャッシュ</text>
    <rect x="730" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="378" text-anchor="middle" font-weight="bold">操作監査</text>
    <text x="830" y="396" text-anchor="middle" font-size="11" fill="#6C757D">全チェーンログ + 送信元検出</text>
    <rect x="950" y="356" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="378" text-anchor="middle" font-weight="bold" font-size="11.5">>セキュリティフィルタ</text>
    <text x="1045" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">HTTP メソッド制限 / CSP</text>

    <rect x="290" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="450" text-anchor="middle" font-weight="bold" font-size="11.5">>XSS / SQL インジェクション</text>
    <text x="390" y="468" text-anchor="middle" font-size="11" fill="#6C757D">SecurityFilter が遮断</text>
    <rect x="510" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="450" text-anchor="middle" font-weight="bold">CSRF</text>
    <text x="610" y="468" text-anchor="middle" font-size="11" fill="#6C757D">トークン検証</text>
    <rect x="730" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="450" text-anchor="middle" font-weight="bold" font-size="11.5">>コマンドインジェクション / パストラバーサル</text>
    <text x="830" y="468" text-anchor="middle" font-size="11" fill="#6C757D">入力境界フィルタ</text>
    <rect x="950" y="428" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="450" text-anchor="middle" font-weight="bold" font-size="12">>Encryptable 暗号化</text>
    <text x="1045" y="468" text-anchor="middle" font-size="11" fill="#6C757D">機密フィールドを暗号文保存 + マスキング</text>

    <rect x="290" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="522" text-anchor="middle" font-weight="bold" font-size="11.5">>アカウントロック</text>
    <text x="390" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">5回失敗で15分ロック</text>
    <rect x="510" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="522" text-anchor="middle" font-weight="bold" font-size="11.5">>クリックキャプチャ</text>
    <text x="610" y="540" text-anchor="middle" font-size="11" fill="#6C757D">ログインのブルートフォース対策</text>
    <rect x="730" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="522" text-anchor="middle" font-weight="bold" font-size="11.5">>コールバック署名検証</text>
    <text x="830" y="540" text-anchor="middle" font-size="11" fill="#6C757D">HMAC 署名 + ホワイトリストルート</text>
    <rect x="950" y="500" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="522" text-anchor="middle" font-weight="bold" font-size="11.5">>キーセキュリティ</text>
    <text x="1045" y="540" text-anchor="middle" font-size="11" fill="#6C757D">環境変数注入・ハードコードゼロ</text>
  </g>
</svg>
