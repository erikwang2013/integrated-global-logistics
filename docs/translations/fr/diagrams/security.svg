<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">Sécurité : défense en profondeur</text>

  <!-- 第一层：网关层 -->
  <rect x="40" y="70" width="1120" height="240" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="70" width="220" height="240" rx="8" fill="#1F4E79"/>
  <text x="150" y="110" text-anchor="middle" font-size="13.9" font-weight="bold" fill="#FFFFFF">Couche passerelle</text>
  <text x="150" y="134" text-anchor="middle" font-size="12.5" fill="#D7E5F3">tracking-gateway (Rust)</text>
  <text x="150" y="154" text-anchor="middle" font-size="11" fill="#D7E5F3">Première ligne de défense</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="118" text-anchor="middle" font-weight="bold">Auth API-Key</text>
    <text x="390" y="136" text-anchor="middle" font-size="11" fill="#6C757D">En-tête X-API-Key, clés chiffrées</text>
    <rect x="510" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="118" text-anchor="middle" font-weight="bold">Rate-limit Redis</text>
    <text x="610" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Fenêtre glissante API-Key/IP</text>
    <rect x="730" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="118" text-anchor="middle" font-weight="bold">Circuit breaker</text>
    <text x="830" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Half-open, fast-fail par transporteur</text>
    <rect x="950" y="96" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="118" text-anchor="middle" font-weight="bold">Anti-SSRF</text>
    <text x="1045" y="136" text-anchor="middle" font-size="11" fill="#6C757D">Résolution whitelist des endpoints workers</text>

    <rect x="290" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="190" text-anchor="middle" font-weight="bold">Isolation des credentials</text>
    <text x="390" y="208" text-anchor="middle" font-size="11" fill="#6C757D">e-cat ne détient aucun credential en clair</text>
    <rect x="510" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="190" text-anchor="middle" font-weight="bold">Protection du contrat interne</text>
    <text x="610" y="208" text-anchor="middle" font-size="11" fill="#6C757D">/internal intranet + en-tête secret partagé</text>
    <rect x="730" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="190" text-anchor="middle" font-weight="bold">Codes d'erreur unifiés</text>
    <text x="830" y="208" text-anchor="middle" font-size="11" fill="#6C757D">carrier_error sans détails internes</text>
    <rect x="950" y="168" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="190" text-anchor="middle" font-weight="bold">Observabilité</text>
    <text x="1045" y="208" text-anchor="middle" font-size="11" fill="#6C757D">/metrics · logs structurés · tracing</text>
  </g>

  <!-- 第二层：应用层 -->
  <rect x="40" y="330" width="1120" height="280" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="330" width="220" height="280" rx="8" fill="#2E86DE"/>
  <text x="150" y="370" text-anchor="middle" font-size="13.9" font-weight="bold" fill="#FFFFFF">Couche applicative</text>
  <text x="150" y="394" text-anchor="middle" font-size="11" fill="#E9F2FB">admin backend d'admin (PHP)</text>
  <text x="150" y="414" text-anchor="middle" font-size="11" fill="#E9F2FB">18 couches défense en profondeur</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="378" text-anchor="middle" font-weight="bold">JWT + blacklist</text>
    <text x="390" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">2h access / 14d refresh</text>
    <rect x="510" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="378" text-anchor="middle" font-weight="bold">Permissions RBAC</text>
    <text x="610" y="396" text-anchor="middle" font-size="11" fill="#6C757D">Granularité method.path + cache permissions</text>
    <rect x="730" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="378" text-anchor="middle" font-weight="bold">Audit d'opérations</text>
    <text x="830" y="396" text-anchor="middle" font-size="11" fill="#6C757D">Logs de bout en bout + détection source</text>
    <rect x="950" y="356" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="378" text-anchor="middle" font-weight="bold">Filtres de sécurité</text>
    <text x="1045" y="396" text-anchor="middle" font-size="11" fill="#6C757D">Limite méthodes HTTP / CSP</text>

    <rect x="290" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="450" text-anchor="middle" font-weight="bold">XSS / injection SQL</text>
    <text x="390" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Bloqué par SecurityFilter</text>
    <rect x="510" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="450" text-anchor="middle" font-weight="bold">CSRF</text>
    <text x="610" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Validation de jeton</text>
    <rect x="730" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="450" text-anchor="middle" font-weight="bold">Injection commande / path traversal</text>
    <text x="830" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Filtrage aux frontières d'entrée</text>
    <rect x="950" y="428" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="450" text-anchor="middle" font-weight="bold">Chiffrement Encryptable</text>
    <text x="1045" y="468" text-anchor="middle" font-size="11" fill="#6C757D">Champs sensibles chiffrés + masqués</text>

    <rect x="290" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="522" text-anchor="middle" font-weight="bold">Verrouillage de compte</text>
    <text x="390" y="540" text-anchor="middle" font-size="11" fill="#6C757D">5 échecs → blocage 15 min</text>
    <rect x="510" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="522" text-anchor="middle" font-weight="bold">Captcha à clic</text>
    <text x="610" y="540" text-anchor="middle" font-size="11" fill="#6C757D">Anti force brute au login</text>
    <rect x="730" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="522" text-anchor="middle" font-weight="bold">Vérification des callbacks</text>
    <text x="830" y="540" text-anchor="middle" font-size="11" fill="#6C757D">Signature HMAC + route whitelist</text>
    <rect x="950" y="500" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="522" text-anchor="middle" font-weight="bold">Sécurité des clés</text>
    <text x="1045" y="540" text-anchor="middle" font-size="11" fill="#6C757D">Injection variables d'env · zéro clé en dur</text>
  </g>
<text x="1188" y="630" fill="rgba(33,37,41,0.35)" font-size="12" font-family="Arial, sans-serif" text-anchor="end">erik.xyz</text>
</svg>
