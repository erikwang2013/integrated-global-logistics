<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="48" text-anchor="middle" font-size="21.6" font-weight="bold" fill="#1F4E79">Plateforme logistique (Integrated Global Logistics)</text>
  <text x="600" y="78" text-anchor="middle" font-size="12.3" fill="#212529">Backend d'admin · passerelle haute fréquence · façade unifiée de 209 transporteurs – un point d'entrée pour le monde entier</text>

  <!-- 支柱一：admin -->
  <g>
    <rect x="40" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="40" y="112" width="360" height="56" rx="8" fill="#1F4E79"/>
    <rect x="40" y="152" width="360" height="16" fill="#1F4E79"/>
    <text x="220" y="138" text-anchor="middle" font-size="16.4" font-weight="bold" fill="#FFFFFF">admin Backend d'administration</text>
    <text x="220" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E86DE">Processus résident PHP webman v2 + admin Flutter</text>
    <text x="220" y="232" text-anchor="middle" font-size="11.1" fill="#212529">Permissions RBAC · Auth JWT · Audit d'opérations</text>
    <text x="220" y="264" text-anchor="middle" font-size="11.1" fill="#212529">Profils transporteurs / clés chiffrées</text>
    <text x="220" y="296" text-anchor="middle" font-size="11.1" fill="#212529">Historique / statistiques / abonnements callback</text>
    <text x="220" y="338" text-anchor="middle" font-size="11" fill="#6C757D"><tspan x="220">18 couches défense en profondeur · export</tspan><tspan x="220" dy="13">Excel/PDF</tspan></text>
    <text x="220" y="368" text-anchor="middle" font-size="11.7" fill="#6C757D">Cache Redis · recherche Elasticsearch</text>
    <text x="220" y="404" text-anchor="middle" font-size="11" fill="#17A2B8">Interface d'admin &amp; pool de workers PHP</text>
  </g>

  <!-- 支柱二：tracking-gateway -->
  <g>
    <rect x="420" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="420" y="112" width="360" height="56" rx="8" fill="#2E86DE"/>
    <rect x="420" y="152" width="360" height="16" fill="#2E86DE"/>
    <text x="600" y="138" text-anchor="middle" font-size="15.1" font-weight="bold" fill="#FFFFFF"><tspan x="600">tracking-gateway passerelle haute</tspan><tspan x="600" dy="13">fréquence</tspan></text>
    <text x="600" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2E86DE">Processus résident framework Rust e-cat</text>
    <text x="600" y="232" text-anchor="middle" font-size="11.1" fill="#212529">Hit cache Redis renvoyé direct (X-Cache: HIT)</text>
    <text x="600" y="264" text-anchor="middle" font-size="11.1" fill="#212529">Auth API-Key · rate-limit par clé</text>
    <text x="600" y="296" text-anchor="middle" font-size="11.1" fill="#212529">Circuit breaker par transporteur (half-open)</text>
    <text x="600" y="328" text-anchor="middle" font-size="11.1" fill="#212529">Load-balancing RoundRobin vers le pool</text>
    <text x="600" y="368" text-anchor="middle" font-size="11.7" fill="#6C757D">/metrics Prometheus · /health healthcheck</text>
    <text x="600" y="404" text-anchor="middle" font-size="11" fill="#17A2B8">Haute fréquence uniquement, ignore les protocoles</text>
  </g>

  <!-- 支柱三：global-logistics -->
  <g>
    <rect x="800" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="800" y="112" width="360" height="56" rx="8" fill="#17A2B8"/>
    <rect x="800" y="152" width="360" height="16" fill="#17A2B8"/>
    <text x="980" y="138" text-anchor="middle" font-size="16.6" font-weight="bold" fill="#FFFFFF">global-logistics façade unifiée</text>
    <text x="980" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2E86DE">209 adaptateurs PHP transporteurs</text>
    <text x="980" y="232" text-anchor="middle" font-size="11" fill="#212529"><tspan x="980">Logistics::track – un point d'entrée,</tspan><tspan x="980" dy="13">auto-détection</tspan></text>
    <text x="980" y="264" text-anchor="middle" font-size="11.1" fill="#212529">45 national + 164 international</text>
    <text x="980" y="296" text-anchor="middle" font-size="11.1" fill="#212529">187 règles de numéros (sensibles à l'ordre)</text>
    <text x="980" y="328" text-anchor="middle" font-size="11.1" fill="#212529">TrackStatus – 7 sémantiques d'état unifiées</text>
    <text x="980" y="368" text-anchor="middle" font-size="11" fill="#6C757D">PSR-18 · OAuth2 · retry auto en cas d'échec</text>
    <text x="980" y="404" text-anchor="middle" font-size="11" fill="#17A2B8">1663 tests / 6662 assertions verts</text>
  </g>

  <!-- 底部数据条 -->
  <rect x="40" y="460" width="1120" height="140" rx="8" fill="#1F4E79"/>
  <text x="600" y="494" text-anchor="middle" font-size="13.1" font-weight="bold" fill="#FFFFFF">Indicateurs clés</text>
  <g font-size="13" fill="#FFFFFF">
    <rect x="80" y="512" width="240" height="64" rx="8" fill="#2E86DE"/>
    <text x="200" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">209</text>
    <text x="200" y="560" text-anchor="middle" fill="#E9F2FB">transporteurs intégrés</text>
    <rect x="340" y="512" width="240" height="64" rx="8" fill="#17A2B8"/>
    <text x="460" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">45 + 164</text>
    <text x="460" y="560" text-anchor="middle" fill="#E8F8FA">canaux national + international</text>
    <rect x="600" y="512" width="240" height="64" rx="8" fill="#2E86DE"/>
    <text x="720" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">187</text>
    <text x="720" y="560" text-anchor="middle" fill="#E9F2FB">règles de numéros</text>
    <rect x="860" y="512" width="260" height="64" rx="8" fill="#17A2B8"/>
    <text x="990" y="536" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">7</text>
    <text x="990" y="560" text-anchor="middle" fill="#E8F8FA">sémantiques d'état TrackStatus</text>
  </g>
</svg>
