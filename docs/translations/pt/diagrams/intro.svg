<?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="48" text-anchor="middle" font-size="24.0" font-weight="bold" fill="#1F4E79">Plataforma de Logística Integrada (Integrated Global Logistics)</text>
  <text x="600" y="78" text-anchor="middle" font-size="15.0" fill="#212529">Painel admin · Gateway de alta frequência · Fachada única para 209 transportadoras — uma entrada para o mundo</text>

  <!-- 支柱一：admin -->
  <g>
    <rect x="40" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="40" y="112" width="360" height="56" rx="8" fill="#1F4E79"/>
    <rect x="40" y="152" width="360" height="16" fill="#1F4E79"/>
    <text x="220" y="138" text-anchor="middle" font-size="20.0" font-weight="bold" fill="#FFFFFF">Painel admin</text>
    <text x="220" y="196" text-anchor="middle" font-size="14.0" font-weight="bold" fill="#2E86DE">PHP webman v2 residente + painel Flutter</text>
    <text x="220" y="232" text-anchor="middle" font-size="13.5" fill="#212529">RBAC · JWT · auditoria de operações</text>
    <text x="220" y="264" text-anchor="middle" font-size="13.3" fill="#212529">Cadastro de transportadoras / chaves criptografadas</text>
    <text x="220" y="296" text-anchor="middle" font-size="13.5" fill="#212529">Consultas / relatórios / assinatura de callbacks</text>
    <text x="220" y="338" text-anchor="middle" font-size="13.0" fill="#6C757D">Defesa em profundidade (18 camadas) · Excel/PDF</text>
    <text x="220" y="368" text-anchor="middle" font-size="13.0" fill="#6C757D">Cache Redis · busca Elasticsearch</text>
    <text x="220" y="404" text-anchor="middle" font-size="13.0" fill="#17A2B8">Painel de gestão + pool de workers PHP</text>
  </g>

  <!-- 支柱二：tracking-gateway -->
  <g>
    <rect x="420" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="420" y="112" width="360" height="56" rx="8" fill="#2E86DE"/>
    <rect x="420" y="152" width="360" height="16" fill="#2E86DE"/>
    <text x="600" y="138" text-anchor="middle" font-size="15.2" font-weight="bold" fill="#FFFFFF">Gateway de alta frequência tracking-gateway</text>
    <text x="600" y="196" text-anchor="middle" font-size="14.0" font-weight="bold" fill="#2E86DE">Processo residente em Rust (e-cat)</text>
    <text x="600" y="232" text-anchor="middle" font-size="13.5" fill="#212529">Cache Redis: resposta imediata (X-Cache: HIT)</text>
    <text x="600" y="264" text-anchor="middle" font-size="13.5" fill="#212529">Auth API-Key · rate limit por chave</text>
    <text x="600" y="296" text-anchor="middle" font-size="13.5" fill="#212529">Circuit breaker por transportadora (half-open)</text>
    <text x="600" y="328" text-anchor="middle" font-size="13.5" fill="#212529">RoundRobin para o pool de workers</text>
    <text x="600" y="368" text-anchor="middle" font-size="13.0" fill="#6C757D">/metrics Prometheus · health check /health</text>
    <text x="600" y="404" text-anchor="middle" font-size="13.0" fill="#17A2B8">Só alta frequência; não conhece protocolos</text>
  </g>

  <!-- 支柱三：global-logistics -->
  <g>
    <rect x="800" y="112" width="360" height="320" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect x="800" y="112" width="360" height="56" rx="8" fill="#17A2B8"/>
    <rect x="800" y="152" width="360" height="16" fill="#17A2B8"/>
    <text x="980" y="138" text-anchor="middle" font-size="19.6" font-weight="bold" fill="#FFFFFF">Fachada unificada global-logistics</text>
    <text x="980" y="196" text-anchor="middle" font-size="14.0" font-weight="bold" fill="#2E86DE">Adaptadores PHP de 209 transportadoras</text>
    <text x="980" y="232" text-anchor="middle" font-size="12.0" fill="#212529">Logistics::track: entrada única com detecção automática</text>
    <text x="980" y="264" text-anchor="middle" font-size="13.5" fill="#212529">45 domésticas + 164 internacionais</text>
    <text x="980" y="296" text-anchor="middle" font-size="13.5" fill="#212529">187 regras de rastreio (sensíveis à ordem)</text>
    <text x="980" y="328" text-anchor="middle" font-size="13.5" fill="#212529">TrackStatus: 7 estados unificados</text>
    <text x="980" y="368" text-anchor="middle" font-size="13.0" fill="#6C757D">PSR-18 · OAuth2 · retry automático</text>
    <text x="980" y="404" text-anchor="middle" font-size="13.0" fill="#17A2B8">1663 testes / 6662 asserções verdes</text>
  </g>

  <!-- 底部数据条 -->
  <rect x="40" y="460" width="1120" height="140" rx="8" fill="#1F4E79"/>
  <text x="600" y="494" text-anchor="middle" font-size="16.0" font-weight="bold" fill="#FFFFFF">Métricas-chave</text>
  <g font-size="13" fill="#FFFFFF">
    <rect x="80" y="512" width="240" height="64" rx="8" fill="#2E86DE"/>
    <text x="200" y="536" text-anchor="middle" font-size="22.0" font-weight="bold" fill="#FFFFFF">209</text>
    <text x="200" y="560" text-anchor="middle" fill="#E9F2FB" font-size="13.0">transportadoras integradas</text>
    <rect x="340" y="512" width="240" height="64" rx="8" fill="#17A2B8"/>
    <text x="460" y="536" text-anchor="middle" font-size="22.0" font-weight="bold" fill="#FFFFFF">45 + 164</text>
    <text x="460" y="560" text-anchor="middle" fill="#E8F8FA" font-size="13.0">canais doméstico + internacional</text>
    <rect x="600" y="512" width="240" height="64" rx="8" fill="#2E86DE"/>
    <text x="720" y="536" text-anchor="middle" font-size="22.0" font-weight="bold" fill="#FFFFFF">187</text>
    <text x="720" y="560" text-anchor="middle" fill="#E9F2FB" font-size="13.0">regras de detecção de rastreio</text>
    <rect x="860" y="512" width="260" height="64" rx="8" fill="#17A2B8"/>
    <text x="990" y="536" text-anchor="middle" font-size="22.0" font-weight="bold" fill="#FFFFFF">7</text>
    <text x="990" y="560" text-anchor="middle" fill="#E8F8FA" font-size="13.0">estados unificados TrackStatus</text>
  </g>
<text x="1188" y="630" fill="rgba(33,37,41,0.35)" font-size="12" font-family="Arial, sans-serif" text-anchor="end">erik.xyz</text>
</svg>