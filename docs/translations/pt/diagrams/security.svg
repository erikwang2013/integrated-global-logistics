<?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#F8F9FA"/>
  <text x="600" y="42" text-anchor="middle" font-size="22.0" font-weight="bold" fill="#1F4E79">Segurança: defesa em profundidade</text>

  <!-- 第一层：网关层 -->
  <rect x="40" y="70" width="1120" height="240" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="70" width="220" height="240" rx="8" fill="#1F4E79"/>
  <text x="150" y="110" text-anchor="middle" font-size="17.0" font-weight="bold" fill="#FFFFFF">Camada de gateway</text>
  <text x="150" y="134" text-anchor="middle" font-size="12.5" fill="#D7E5F3">tracking-gateway (Rust)</text>
  <text x="150" y="154" text-anchor="middle" font-size="12.5" fill="#D7E5F3">Primeira linha de defesa</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">Auth API-Key</text>
    <text x="390" y="136" text-anchor="middle" font-size="11.0" fill="#6C757D">Cabeçalho X-API-Key; chave criptografada</text>
    <rect x="510" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">Rate limit Redis</text>
    <text x="610" y="136" text-anchor="middle" font-size="11.1" fill="#6C757D">Janela deslizante por API-Key/IP</text>
    <rect x="730" y="96" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">Circuit breaker</text>
    <text x="830" y="136" text-anchor="middle" font-size="11.0" fill="#6C757D">Half-open por transportadora, falha rápida</text>
    <rect x="950" y="96" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="118" text-anchor="middle" font-weight="bold" font-size="13.0">Proteção SSRF</text>
    <text x="1045" y="136" text-anchor="middle" font-size="11.0" fill="#6C757D">Allowlist de endpoints do worker</text>

    <rect x="290" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="390" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">Isolamento de credenciais</text>
    <text x="390" y="208" text-anchor="middle" font-size="11.5" fill="#6C757D">e-cat: sem credenciais em claro</text>
    <rect x="510" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="610" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">Proteção do contrato interno</text>
    <text x="610" y="208" text-anchor="middle" font-size="11.0" fill="#6C757D">/internal: intranet + header de chave</text>
    <rect x="730" y="168" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="830" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">Códigos de erro unificados</text>
    <text x="830" y="208" text-anchor="middle" font-size="11.5" fill="#6C757D">carrier_error não expõe detalhes</text>
    <rect x="950" y="168" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#2E86DE"/>
    <text x="1045" y="190" text-anchor="middle" font-weight="bold" font-size="13.0">Observabilidade</text>
    <text x="1045" y="208" text-anchor="middle" font-size="11.0" fill="#6C757D">/metrics · logs estruturados · tracing</text>
  </g>

  <!-- 第二层：应用层 -->
  <rect x="40" y="330" width="1120" height="280" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="40" y="330" width="220" height="280" rx="8" fill="#2E86DE"/>
  <text x="150" y="370" text-anchor="middle" font-size="17.0" font-weight="bold" fill="#FFFFFF">Camada de aplicação</text>
  <text x="150" y="394" text-anchor="middle" font-size="12.5" fill="#E9F2FB">Painel admin (PHP)</text>
  <text x="150" y="414" text-anchor="middle" font-size="12.5" fill="#E9F2FB">18 camadas de defesa</text>

  <g font-size="13" fill="#212529">
    <rect x="290" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">JWT + lista negra</text>
    <text x="390" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">2h access / 14d refresh</text>
    <rect x="510" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">Permissões RBAC</text>
    <text x="610" y="396" text-anchor="middle" font-size="11.1" fill="#6C757D">method.path + cache de permissões</text>
    <rect x="730" y="356" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">Auditoria de operações</text>
    <text x="830" y="396" text-anchor="middle" font-size="11.5" fill="#6C757D">Logs ponta a ponta + origem</text>
    <rect x="950" y="356" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="378" text-anchor="middle" font-weight="bold" font-size="13.0">Filtro de segurança</text>
    <text x="1045" y="396" text-anchor="middle" font-size="11.0" fill="#6C757D">Limitação de métodos HTTP / CSP</text>

    <rect x="290" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">XSS / injeção SQL</text>
    <text x="390" y="468" text-anchor="middle" font-size="11.3" fill="#6C757D">Interceptado pelo SecurityFilter</text>
    <rect x="510" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">CSRF</text>
    <text x="610" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">Validação de token</text>
    <rect x="730" y="428" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">Injeção de comando / path</text>
    <text x="830" y="468" text-anchor="middle" font-size="11.5" fill="#6C757D">Filtro na fronteira de entrada</text>
    <rect x="950" y="428" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="450" text-anchor="middle" font-weight="bold" font-size="13.0">Criptografia Encryptable</text>
    <text x="1045" y="468" text-anchor="middle" font-size="11.0" fill="#6C757D">Campos sensíveis criptografados</text>

    <rect x="290" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="390" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">Bloqueio de conta</text>
    <text x="390" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">5 falhas bloqueiam 15 min</text>
    <rect x="510" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="610" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">CAPTCHA de clique</text>
    <text x="610" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">Proteção contra força bruta</text>
    <rect x="730" y="500" width="200" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="830" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">Verificação de assinatura</text>
    <text x="830" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">Assinatura HMAC + allowlist</text>
    <rect x="950" y="500" width="190" height="52" rx="8" fill="#F8F9FA" stroke="#17A2B8"/>
    <text x="1045" y="522" text-anchor="middle" font-weight="bold" font-size="13.0">Segurança de chaves</text>
    <text x="1045" y="540" text-anchor="middle" font-size="11.5" fill="#6C757D">Env vars · zero hardcoded</text>
  </g>
<text x="1188" y="630" fill="rgba(33,37,41,0.35)" font-size="12" font-family="Arial, sans-serif" text-anchor="end">erik.xyz</text>
</svg>