    /* 呼吸：从脚底向上轻微起伏 */
    .ecat-pet  { transform-origin: 256px 466px;  }
    

    /* 头部浮动 */
    .ecat-head { transform-origin: 256px 282px;  }
    

    /* 尾巴摇摆 */
    .ecat-tail { transform-origin: 140px 428px;  }
    

    /* 眨眼 */
