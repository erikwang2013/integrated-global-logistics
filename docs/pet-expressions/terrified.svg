    /* 耳朵轻抖 */
    .ecat-ear-l { transform-origin: 211px 139px;  }
    
    .ecat-ear-r { transform-origin: 301px 139px;  }
    

    /* 雷达扫描 */
    .radar-sweep { transform-origin: 256px 256px;  }
    

